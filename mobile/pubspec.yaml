name: solar3d_mobile
description: Solar3D EPC Platform - Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # ConnectRPC / Protobuf
  connectrpc: ^0.3.0
  protobuf: ^3.1.0
  http: ^1.2.1

  # Networking (for non-RPC calls)
  dio: ^5.4.2+1
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.0.3

  # Navigation
  go_router: ^14.2.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Utils
  intl: ^0.19.0
  logger: ^2.2.0
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  path_provider: ^2.1.2
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  bloc_test: ^9.1.7
  mockito: ^5.4.4
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
