worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── Upstreams ─────────────────────────────────────────────
    # Core Go services (container-name:internal-port)
    upstream project_svc      { server project-service:8001; }
    upstream terrain_svc      { server terrain-service:8002; }
    upstream layout_svc       { server layout-service:8003; }
    upstream simulation_svc   { server simulation-service:8004; }
    upstream electrical_svc   { server electrical-service:8005; }
    upstream routing_svc      { server routing-service:8006; }
    upstream report_svc       { server report-service:8007; }
    upstream asset_svc        { server asset-service:8008; }

    # CAD services (all listen on internal port 8080)
    upstream drawing_revision { server drawing-revision-service:8080; }
    upstream cad_core         { server cad-core-service:8080; }
    upstream cad_annotation   { server cad-annotation-service:8080; }
    upstream cad_layer_block  { server cad-layer-block-service:8080; }
    upstream interop          { server interop-service:8080; }
    upstream plot_sheet       { server plot-sheet-service:8080; }

    # API gateway (aggregates CAD + projects workspace)
    upstream api_gateway      { server api-gateway-service:8080; }

    # Frontend SvelteKit SSR
    upstream frontend_app     { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        # ── ConnectRPC: CAD services (by full service name) ────
        location /drawing.v1.DrawingRevisionService/ {
            proxy_pass http://drawing_revision;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /drawing.v1.CadCoreService/ {
            proxy_pass http://cad_core;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /drawing.v1.CadAnnotationService/ {
            proxy_pass http://cad_annotation;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /drawing.v1.CadLayerBlockService/ {
            proxy_pass http://cad_layer_block;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /drawing.v1.InteropService/ {
            proxy_pass http://interop;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /drawing.v1.PlotSheetService/ {
            proxy_pass http://plot_sheet;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── ConnectRPC: core services (by proto package prefix) ─
        location /solar.project.v1/ {
            proxy_pass http://project_svc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /terrain.v1/ {
            proxy_pass http://terrain_svc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /layout.v1/ {
            proxy_pass http://layout_svc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /simulation.v1/ {
            proxy_pass http://simulation_svc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /electrical.v1/ {
            proxy_pass http://electrical_svc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /routing.v1/ {
            proxy_pass http://routing_svc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /report.v1/ {
            proxy_pass http://report_svc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /asset.v1/ {
            proxy_pass http://asset_svc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── REST: CAD workspace aggregation (api-gateway) ──────
        location /api/v1/workspace/ {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── REST: project-service CRUD routes ──────────────────
        location /api/v1/ {
            proxy_pass http://project_svc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Frontend: everything else ──────────────────────────
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
