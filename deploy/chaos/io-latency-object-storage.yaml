---
# Chaos Mesh — IOChaos: inject 500ms latency on object-storage reads for report-service.
# Expected behaviour: report generation slower but succeeds; no 5xx;
# report-service surfaces a "slow storage" metric for alerting.
apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: slow-report-storage
  namespace: solar3d-staging
spec:
  action: latency
  mode: all
  selector:
    namespaces:
      - solar3d-staging
    labelSelectors:
      app: report-service
  volumePath: /var/lib/solar3d/objstore
  path: '/var/lib/solar3d/objstore/**/*'
  delay: '500ms'
  percent: 50
  duration: '10m'
