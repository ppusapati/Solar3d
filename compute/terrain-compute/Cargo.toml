[package]
name = "terrain-compute"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "terrain_http_bridge"
path = "src/bin/http_bridge.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
tiny_http = "0.12"
bridge-core = { path = "../bridge-core" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "terrain_bench"
harness = false
