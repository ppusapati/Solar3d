[package]
name = "optimization-compute"
version = "0.1.0"
edition = "2021"

[dependencies]
bridge-core = { path = "../bridge-core" }
common = { path = "../common" }
serde = { version = "1.0", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "optimization_bench"
harness = false

[[bin]]
name = "opt_http_bridge"
path = "src/bin/http_bridge.rs"
