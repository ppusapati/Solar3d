syntax = "proto3";

package drawing.v1;

option go_package = "github.com/solar3d/solar3d/gen/drawing/v1;drawingv1";

import "common/v1/primitives.proto";
import "google/protobuf/timestamp.proto";

enum DrawingEntityType {
  DRAWING_ENTITY_TYPE_UNSPECIFIED = 0;
  DRAWING_ENTITY_TYPE_POLYLINE = 1;
  DRAWING_ENTITY_TYPE_POLYGON = 2;
  DRAWING_ENTITY_TYPE_TEXT = 3;
  DRAWING_ENTITY_TYPE_DIMENSION = 4;
  DRAWING_ENTITY_TYPE_BLOCK_REFERENCE = 5;
  DRAWING_ENTITY_TYPE_LAYER_DEFINITION = 6;
  DRAWING_ENTITY_TYPE_BLOCK_DEFINITION = 7;
  DRAWING_ENTITY_TYPE_LEADER = 8;
  DRAWING_ENTITY_TYPE_SHEET = 9;
}

enum RevisionAction {
  REVISION_ACTION_UNSPECIFIED = 0;
  REVISION_ACTION_CREATE = 1;
  REVISION_ACTION_UPDATE = 2;
  REVISION_ACTION_DELETE = 3;
}

message LayerRef {
  string layer_id = 1;
  string layer_name = 2;
}

message StyleRef {
  string style_id = 1;
  string style_name = 2;
}

message EntityHeader {
  string entity_id = 1;
  string drawing_id = 2;
  DrawingEntityType entity_type = 3;
  LayerRef layer = 4;
  StyleRef style = 5;
  string metadata_json = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  common.v1.ContractMetadata contract = 9;
}

message PolylineEntity {
  repeated common.v1.Point2D vertices = 1;
  bool closed = 2;
}

message PolygonEntity {
  common.v1.Polygon2D geometry = 1;
}

message TextEntity {
  common.v1.Point2D anchor = 1;
  string text = 2;
  double rotation_deg = 3;
  double height = 4;
  string font_family = 5;
}

message DimensionEntity {
  common.v1.Point2D start = 1;
  common.v1.Point2D end = 2;
  common.v1.Point2D text_anchor = 3;
  string unit = 4;
  double precision = 5;
}

message BlockReferenceEntity {
  string block_definition_id = 1;
  common.v1.Point2D insertion_point = 2;
  double rotation_deg = 3;
  double scale_x = 4;
  double scale_y = 5;
  map<string, string> attributes = 6;
}

message LayerDefinitionEntity {
  string layer_id = 1;
  string name = 2;
  string color_hex = 3;
  string line_type = 4;
  double line_weight_mm = 5;
  bool visible = 6;
  bool locked = 7;
  bool plottable = 8;
}

message BlockDefinitionEntity {
  string block_definition_id = 1;
  string name = 2;
  common.v1.Point2D base_point = 3;
  repeated DrawingEntity entities = 4;
  map<string, string> default_attributes = 5;
}

message LeaderEntity {
  repeated common.v1.Point2D vertices = 1;
  string text = 2;
  double text_height = 3;
  string arrow_head = 4;
}

message SheetEntity {
  string sheet_id = 1;
  string title = 2;
  double page_width_mm = 3;
  double page_height_mm = 4;
  double view_scale = 5;
  repeated string viewport_entity_ids = 6;
  string title_block_name = 7;
  string metadata_json = 8;
}

message DrawingEntity {
  EntityHeader header = 1;
  oneof geometry {
    PolylineEntity polyline = 2;
    PolygonEntity polygon = 3;
    TextEntity text = 4;
    DimensionEntity dimension = 5;
    BlockReferenceEntity block_reference = 6;
    LayerDefinitionEntity layer_definition = 7;
    BlockDefinitionEntity block_definition = 8;
    LeaderEntity leader = 9;
    SheetEntity sheet = 10;
  }
}

message RevisionPointer {
  string revision_id = 1;
  string parent_revision_id = 2;
  string author = 3;
  string summary = 4;
  google.protobuf.Timestamp committed_at = 5;
  common.v1.ContractMetadata contract = 6;
}

message DrawingMutation {
  RevisionAction action = 1;
  string entity_id = 2;
  DrawingEntity before = 3;
  DrawingEntity after = 4;
}

message DrawingCommand {
  string command_id = 1;
  string drawing_id = 2;
  string actor = 3;
  repeated DrawingMutation mutations = 4;
  google.protobuf.Timestamp issued_at = 5;
  common.v1.ContractMetadata contract = 6;
}

enum DrawingStatus {
  DRAWING_STATUS_UNSPECIFIED = 0;
  DRAWING_STATUS_ACTIVE = 1;
  DRAWING_STATUS_ARCHIVED = 2;
}

message Drawing {
  string drawing_id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  string metadata_json = 5;
  DrawingStatus status = 6;
  string current_revision_id = 7;
  uint32 revision_count = 8;
  uint32 entity_count = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  common.v1.ContractMetadata contract = 12;
}

message DrawingRevision {
  RevisionPointer pointer = 1;
  string drawing_id = 2;
  string command_id = 3;
  repeated DrawingEntity entities = 4;
}

message CreateDrawingRequest {
  string project_id = 1;
  string name = 2;
  string description = 3;
  string metadata_json = 4;
  string author = 5;
  common.v1.ContractMetadata contract = 6;
}

message CreateDrawingResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
}

message GetDrawingRequest {
  string drawing_id = 1;
}

message GetDrawingResponse {
  Drawing drawing = 1;
}

message ListDrawingsRequest {
  string project_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
  bool include_archived = 4;
}

message ListDrawingsResponse {
  repeated Drawing drawings = 1;
  string next_page_token = 2;
  uint32 total_count = 3;
}

message UpdateDrawingRequest {
  string drawing_id = 1;
  string name = 2;
  string description = 3;
  string metadata_json = 4;
  DrawingStatus status = 5;
}

message UpdateDrawingResponse {
  Drawing drawing = 1;
}

message GetDrawingStateRequest {
  string drawing_id = 1;
  string revision_id = 2;
}

message GetDrawingStateResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
}

message ListDrawingRevisionsRequest {
  string drawing_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListDrawingRevisionsResponse {
  repeated RevisionPointer revisions = 1;
  string next_page_token = 2;
  uint32 total_count = 3;
}

message GetDrawingRevisionRequest {
  string drawing_id = 1;
  string revision_id = 2;
}

message GetDrawingRevisionResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
}

message StoreDrawingRevisionRequest {
  string drawing_id = 1;
  string author = 2;
  string summary = 3;
  string command_id = 4;
  repeated DrawingEntity entities = 5;
  common.v1.ContractMetadata contract = 6;
}

message StoreDrawingRevisionResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
}

message ValidateDrawingCommandRequest {
  DrawingCommand command = 1;
  string base_revision_id = 2;
}

message ValidateDrawingCommandResponse {
  bool valid = 1;
  repeated string violations = 2;
  repeated DrawingEntity resulting_entities = 3;
}

message CommitDrawingCommandRequest {
  DrawingCommand command = 1;
  string base_revision_id = 2;
  string summary = 3;
}

message CommitDrawingCommandResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
}

message RevertDrawingRevisionRequest {
  string drawing_id = 1;
  string target_revision_id = 2;
  string author = 3;
  string summary = 4;
}

message RevertDrawingRevisionResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
}

enum FileFormat {
  FILE_FORMAT_UNSPECIFIED = 0;
  FILE_FORMAT_SOLAR3D_JSON = 1;
  FILE_FORMAT_DXF_ASCII = 2;
}

enum InteropMergeStrategy {
  INTEROP_MERGE_STRATEGY_UNSPECIFIED = 0;
  INTEROP_MERGE_STRATEGY_REPLACE = 1;
  INTEROP_MERGE_STRATEGY_APPEND = 2;
  INTEROP_MERGE_STRATEGY_UPSERT = 3;
}

enum PlotOutputFormat {
  PLOT_OUTPUT_FORMAT_UNSPECIFIED = 0;
  PLOT_OUTPUT_FORMAT_SVG = 1;
  PLOT_OUTPUT_FORMAT_PDF = 2;
}

message AnnotationReference {
  string entity_id = 1;
  DrawingEntityType entity_type = 2;
}

message AnnotationTextSpec {
  common.v1.Point2D anchor = 1;
  string text = 2;
  double rotation_deg = 3;
  double height = 4;
  string font_family = 5;
}

message AnnotationDimensionSpec {
  common.v1.Point2D start = 1;
  common.v1.Point2D end = 2;
  common.v1.Point2D text_anchor = 3;
  string unit = 4;
  double precision = 5;
  repeated AnnotationReference associations = 6;
}

message AnnotationLeaderSpec {
  repeated common.v1.Point2D vertices = 1;
  string text = 2;
  double text_height = 3;
  string arrow_head = 4;
  repeated AnnotationReference associations = 5;
}

message AnnotationSpec {
  oneof kind {
    AnnotationTextSpec text = 1;
    AnnotationDimensionSpec dimension = 2;
    AnnotationLeaderSpec leader = 3;
  }
}

message CreateAnnotationRequest {
  string drawing_id = 1;
  string base_revision_id = 2;
  string author = 3;
  string summary = 4;
  string layer_id = 5;
  string layer_name = 6;
  string style_id = 7;
  string style_name = 8;
  string metadata_json = 9;
  AnnotationSpec annotation = 10;
  common.v1.ContractMetadata contract = 11;
}

message CreateAnnotationResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
  DrawingEntity annotation_entity = 3;
}

message RegenerateAssociativeAnnotationsRequest {
  string drawing_id = 1;
  string base_revision_id = 2;
  string author = 3;
  string summary = 4;
  common.v1.ContractMetadata contract = 5;
}

message RegenerateAssociativeAnnotationsResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
  repeated DrawingEntity updated_annotations = 3;
  repeated string violations = 4;
}

message UpsertLayerRequest {
  string drawing_id = 1;
  string base_revision_id = 2;
  string author = 3;
  string summary = 4;
  string metadata_json = 5;
  LayerDefinitionEntity layer = 6;
  common.v1.ContractMetadata contract = 7;
}

message UpsertLayerResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
  DrawingEntity layer_entity = 3;
}

message CreateBlockDefinitionRequest {
  string drawing_id = 1;
  string base_revision_id = 2;
  string author = 3;
  string summary = 4;
  string layer_id = 5;
  string layer_name = 6;
  string style_id = 7;
  string style_name = 8;
  string metadata_json = 9;
  BlockDefinitionEntity block = 10;
  common.v1.ContractMetadata contract = 11;
}

message CreateBlockDefinitionResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
  DrawingEntity block_entity = 3;
}

message InsertBlockReferenceRequest {
  string drawing_id = 1;
  string base_revision_id = 2;
  string author = 3;
  string summary = 4;
  string layer_id = 5;
  string layer_name = 6;
  string style_id = 7;
  string style_name = 8;
  string metadata_json = 9;
  BlockReferenceEntity block_reference = 10;
  common.v1.ContractMetadata contract = 11;
}

message InsertBlockReferenceResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
  DrawingEntity block_reference_entity = 3;
}

message FidelityReport {
  uint32 source_entity_count = 1;
  uint32 output_entity_count = 2;
  uint32 matched_entity_count = 3;
  repeated string warnings = 4;
}

message ExportDrawingRequest {
  string drawing_id = 1;
  string revision_id = 2;
  FileFormat format = 3;
}

message ExportDrawingResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
  FileFormat format = 3;
  string file_name = 4;
  string content_type = 5;
  bytes payload = 6;
  FidelityReport report = 7;
}

message ImportDrawingRequest {
  string drawing_id = 1;
  string base_revision_id = 2;
  string author = 3;
  string summary = 4;
  FileFormat format = 5;
  bytes payload = 6;
  InteropMergeStrategy merge_strategy = 7;
  common.v1.ContractMetadata contract = 8;
}

message ImportDrawingResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
  FidelityReport report = 3;
}

message ValidateDrawingRoundTripRequest {
  string drawing_id = 1;
  string revision_id = 2;
  FileFormat format = 3;
}

message ValidateDrawingRoundTripResponse {
  FidelityReport report = 1;
}

message CreateSheetRequest {
  string drawing_id = 1;
  string base_revision_id = 2;
  string author = 3;
  string summary = 4;
  string layer_id = 5;
  string layer_name = 6;
  string style_id = 7;
  string style_name = 8;
  string metadata_json = 9;
  SheetEntity sheet = 10;
  common.v1.ContractMetadata contract = 11;
}

message CreateSheetResponse {
  Drawing drawing = 1;
  DrawingRevision revision = 2;
  DrawingEntity sheet_entity = 3;
}

message PlotOptions {
  bool monochrome = 1;
  bool include_metadata = 2;
  double stroke_width_mm = 3;
}

message PublishedSheetArtifact {
  string sheet_id = 1;
  string title = 2;
  PlotOutputFormat format = 3;
  string file_name = 4;
  string content_type = 5;
  bytes payload = 6;
}

message PublishDrawingRequest {
  string drawing_id = 1;
  string revision_id = 2;
  repeated string sheet_ids = 3;
  PlotOutputFormat format = 4;
  PlotOptions options = 5;
}

message PublishDrawingResponse {
  repeated PublishedSheetArtifact artifacts = 1;
  string manifest_json = 2;
}

// DrawingRevisionService manages drawing metadata and immutable revision snapshots.
service DrawingRevisionService {
  // CreateDrawing creates a new drawing and its initial empty revision.
  rpc CreateDrawing(CreateDrawingRequest) returns (CreateDrawingResponse);
  // GetDrawing returns drawing metadata without materializing entity state.
  rpc GetDrawing(GetDrawingRequest) returns (GetDrawingResponse);
  // ListDrawings returns drawings for a project in descending update order.
  rpc ListDrawings(ListDrawingsRequest) returns (ListDrawingsResponse);
  // UpdateDrawing updates mutable drawing metadata and archive status.
  rpc UpdateDrawing(UpdateDrawingRequest) returns (UpdateDrawingResponse);
  // GetDrawingState returns a materialized snapshot for the requested revision or current head.
  rpc GetDrawingState(GetDrawingStateRequest) returns (GetDrawingStateResponse);
  // ListDrawingRevisions returns revision pointers for a drawing head history.
  rpc ListDrawingRevisions(ListDrawingRevisionsRequest) returns (ListDrawingRevisionsResponse);
  // GetDrawingRevision returns a specific immutable drawing revision snapshot.
  rpc GetDrawingRevision(GetDrawingRevisionRequest) returns (GetDrawingRevisionResponse);
  // StoreDrawingRevision persists a new immutable snapshot and advances the drawing head.
  rpc StoreDrawingRevision(StoreDrawingRevisionRequest) returns (StoreDrawingRevisionResponse);
}

// CadCoreService validates and applies drawing commands on top of revision storage.
service CadCoreService {
  // ValidateDrawingCommand validates a command against a drawing revision without persisting it.
  rpc ValidateDrawingCommand(ValidateDrawingCommandRequest) returns (ValidateDrawingCommandResponse);
  // CommitDrawingCommand validates and persists a command as a new drawing revision.
  rpc CommitDrawingCommand(CommitDrawingCommandRequest) returns (CommitDrawingCommandResponse);
  // RevertDrawingRevision promotes a previous revision snapshot as the new drawing head.
  rpc RevertDrawingRevision(RevertDrawingRevisionRequest) returns (RevertDrawingRevisionResponse);
}

// CadAnnotationService manages associative drafting annotations layered on CadCoreService.
service CadAnnotationService {
  // CreateAnnotation creates a text, dimension, or leader annotation entity on a drawing revision.
  rpc CreateAnnotation(CreateAnnotationRequest) returns (CreateAnnotationResponse);
  // RegenerateAssociativeAnnotations recalculates associative annotations from their referenced source geometry.
  rpc RegenerateAssociativeAnnotations(RegenerateAssociativeAnnotationsRequest) returns (RegenerateAssociativeAnnotationsResponse);
}

// CadLayerBlockService manages layer standards, block definitions, and block inserts.
service CadLayerBlockService {
  // UpsertLayer creates or updates a managed layer definition entity in the drawing model.
  rpc UpsertLayer(UpsertLayerRequest) returns (UpsertLayerResponse);
  // CreateBlockDefinition stores a reusable block definition with embedded drafting geometry.
  rpc CreateBlockDefinition(CreateBlockDefinitionRequest) returns (CreateBlockDefinitionResponse);
  // InsertBlockReference places a block reference instance for an existing block definition.
  rpc InsertBlockReference(InsertBlockReferenceRequest) returns (InsertBlockReferenceResponse);
}

// InteropService imports, exports, and validates round-trips for supported CAD exchange formats.
service InteropService {
  // ExportDrawing serializes a drawing revision into a supported exchange format.
  rpc ExportDrawing(ExportDrawingRequest) returns (ExportDrawingResponse);
  // ImportDrawing materializes exchange-format payloads into drawing entities and commits them.
  rpc ImportDrawing(ImportDrawingRequest) returns (ImportDrawingResponse);
  // ValidateDrawingRoundTrip exports and reimports a drawing revision to measure fidelity.
  rpc ValidateDrawingRoundTrip(ValidateDrawingRoundTripRequest) returns (ValidateDrawingRoundTripResponse);
}

// PlotSheetService manages sheet definitions and publish artifacts.
service PlotSheetService {
  // CreateSheet persists a sheet definition entity for later publishing.
  rpc CreateSheet(CreateSheetRequest) returns (CreateSheetResponse);
  // PublishDrawing renders selected sheets as SVG or PDF publish artifacts.
  rpc PublishDrawing(PublishDrawingRequest) returns (PublishDrawingResponse);
}
