syntax = "proto3";

package project.v1;

option go_package = "github.com/solar3d/solar3d/gen/project/v1;projectv1";

import "google/protobuf/timestamp.proto";
import "planning/v1/planning_workflow.proto";

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  rpc TransitionPhase(TransitionPhaseRequest) returns (TransitionPhaseResponse);
  rpc GetPhaseState(GetPhaseStateRequest) returns (GetPhaseStateResponse);
  rpc ListPhaseTransitions(ListPhaseTransitionsRequest) returns (ListPhaseTransitionsResponse);
  rpc ValidatePhaseReadiness(ValidatePhaseReadinessRequest) returns (ValidatePhaseReadinessResponse);
}

message Project {
  string id = 1;
  string name = 2;
  string description = 3;
  ProjectStatus status = 4;
  Site site = 5;
  ProjectMetadata metadata = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  planning.v1.WorkflowPhase workflow_phase = 9;
  google.protobuf.Timestamp phase_entered_at = 10;
  repeated PhaseTransitionHistoryEntry transition_history = 11;
  repeated string active_blockers = 12;
}

message Site {
  string id = 1;
  string project_id = 2;
  string name = 3;
  // GeoJSON polygon boundary
  string boundary_geojson = 4;
  double area_sqm = 5;
  double latitude = 6;
  double longitude = 7;
  string timezone = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ProjectMetadata {
  double target_capacity_mw = 1;
  string location_name = 2;
  string client_name = 3;
  string notes = 4;
}

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_DRAFT = 1;
  PROJECT_STATUS_DESIGN = 2;
  PROJECT_STATUS_SIMULATION = 3;
  PROJECT_STATUS_REVIEW = 4;
  PROJECT_STATUS_APPROVED = 5;
  PROJECT_STATUS_ARCHIVED = 6;
}

message CreateProjectRequest {
  string name = 1;
  string description = 2;
  ProjectMetadata metadata = 3;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  int32 page_size = 1;
  string page_token = 2;
  ProjectStatus status_filter = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateProjectRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  ProjectStatus status = 4;
  ProjectMetadata metadata = 5;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string id = 1;
}

message DeleteProjectResponse {}

// ========== Workflow Phase Management Messages ==========

message PhaseTransitionHistoryEntry {
  string id = 1;
  planning.v1.WorkflowPhase from_phase = 2;
  planning.v1.WorkflowPhase to_phase = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string actor_id = 5;
  string reason = 6;
  bool is_rollback = 7;
  string rollback_reason = 8;
}

message TransitionPhaseRequest {
  string project_id = 1;
  planning.v1.WorkflowPhase target_phase = 2;
  planning.v1.TransitionEvidence evidence = 3;
  string actor_id = 4;
  string reason = 5;
}

message TransitionPhaseResponse {
  string project_id = 1;
  planning.v1.WorkflowPhase previous_phase = 2;
  planning.v1.WorkflowPhase current_phase = 3;
  PhaseTransitionHistoryEntry transition_record = 4;
  bool was_noop = 5;
}

message GetPhaseStateRequest {
  string project_id = 1;
}

message GetPhaseStateResponse {
  string project_id = 1;
  planning.v1.WorkflowPhase current_phase = 2;
  google.protobuf.Timestamp phase_entered_at = 3;
  PhaseTransitionHistoryEntry last_transition = 4;
}

message ListPhaseTransitionsRequest {
  string project_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListPhaseTransitionsResponse {
  repeated PhaseTransitionHistoryEntry transitions = 1;
  string next_page_token = 2;
}

message ValidatePhaseReadinessRequest {
  string project_id = 1;
  planning.v1.WorkflowPhase target_phase = 2;
  planning.v1.TransitionEvidence evidence = 3;
}

message ValidatePhaseReadinessResponse {
  string project_id = 1;
  planning.v1.WorkflowPhase current_phase = 2;
  planning.v1.WorkflowPhase target_phase = 3;
  bool is_valid = 4;
  repeated string blocker_reasons = 5;
  google.protobuf.Timestamp can_transition_after = 6;
}
