syntax = "proto3";

package asset.v1;

option go_package = "github.com/solar3d/solar3d/gen/asset/v1;assetv1";

import "google/protobuf/timestamp.proto";

service AssetService {
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse);
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);
}

message Asset {
  string id = 1;
  string name = 2;
  string manufacturer = 3;
  string model = 4;
  AssetCategory category = 5;
  Dimensions dimensions = 6;
  ElectricalParameters electrical = 7;
  string model_3d_path = 8;
  string datasheet_path = 9;
  string metadata_json = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

enum AssetCategory {
  ASSET_CATEGORY_UNSPECIFIED = 0;
  ASSET_CATEGORY_SOLAR_PANEL = 1;
  ASSET_CATEGORY_TRACKER = 2;
  ASSET_CATEGORY_STRING_INVERTER = 3;
  ASSET_CATEGORY_CENTRAL_INVERTER = 4;
  ASSET_CATEGORY_TRANSFORMER = 5;
  ASSET_CATEGORY_JUNCTION_BOX = 6;
  ASSET_CATEGORY_COMBINER_BOX = 7;
  ASSET_CATEGORY_CABLE = 8;
  ASSET_CATEGORY_MOUNTING_STRUCTURE = 9;
  ASSET_CATEGORY_SUBSTATION = 10;
}

message Dimensions {
  double width_mm = 1;
  double height_mm = 2;
  double depth_mm = 3;
  double weight_kg = 4;
}

message ElectricalParameters {
  // Panel parameters
  double rated_power_w = 1;
  double voc = 2;
  double isc = 3;
  double vmp = 4;
  double imp = 5;
  double efficiency = 6;
  double temp_coefficient_pmax = 7;
  double temp_coefficient_voc = 8;

  // Inverter parameters
  double max_dc_input_w = 9;
  double max_ac_output_w = 10;
  int32 mppt_count = 11;
  double max_input_voltage = 12;
  double min_input_voltage = 13;
  int32 max_strings_per_mppt = 14;

  // Transformer parameters
  double kva_rating = 15;
  double primary_voltage = 16;
  double secondary_voltage = 17;
}

message CreateAssetRequest {
  string name = 1;
  string manufacturer = 2;
  string model = 3;
  AssetCategory category = 4;
  Dimensions dimensions = 5;
  ElectricalParameters electrical = 6;
  string model_3d_path = 7;
  string metadata_json = 8;
}

message CreateAssetResponse {
  Asset asset = 1;
}

message GetAssetRequest {
  string id = 1;
}

message GetAssetResponse {
  Asset asset = 1;
}

message ListAssetsRequest {
  AssetCategory category_filter = 1;
  string manufacturer_filter = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListAssetsResponse {
  repeated Asset assets = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateAssetRequest {
  string id = 1;
  string name = 2;
  string manufacturer = 3;
  string model = 4;
  Dimensions dimensions = 5;
  ElectricalParameters electrical = 6;
  string model_3d_path = 7;
  string metadata_json = 8;
}

message UpdateAssetResponse {
  Asset asset = 1;
}

message DeleteAssetRequest {
  string id = 1;
}

message DeleteAssetResponse {}
