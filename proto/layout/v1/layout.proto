syntax = "proto3";

package layout.v1;

option go_package = "p9e.in/samavaya/solar3d/gen/layout/v1;layoutv1";

import "google/protobuf/timestamp.proto";

// LayoutService manages solar farm layout entities including panel arrays,
// components (inverters, transformers, trackers), tile-based spatial queries,
// and the acceptance workflow gate required for ElectricalReady phase progression.
service LayoutService {
  // CreateLayout creates a new empty layout for a project.
  rpc CreateLayout(CreateLayoutRequest) returns (CreateLayoutResponse);
  // GetLayout retrieves a layout by ID including its current review metadata.
  rpc GetLayout(GetLayoutRequest) returns (GetLayoutResponse);
  // ListLayouts returns all layouts for a project ordered by creation time.
  rpc ListLayouts(ListLayoutsRequest) returns (ListLayoutsResponse);
  // DeleteLayout permanently removes a layout and all its components and tiles.
  rpc DeleteLayout(DeleteLayoutRequest) returns (DeleteLayoutResponse);

  // Component placement
  rpc PlaceComponent(PlaceComponentRequest) returns (PlaceComponentResponse);
  // MoveComponent updates the position of an existing placed component.
  rpc MoveComponent(MoveComponentRequest) returns (MoveComponentResponse);
  // RemoveComponent removes a placed component from the layout.
  rpc RemoveComponent(RemoveComponentRequest) returns (RemoveComponentResponse);
  // ListComponents returns all placed components for a layout.
  rpc ListComponents(ListComponentsRequest) returns (ListComponentsResponse);

  // Panel array generation
  rpc GeneratePanelArray(GeneratePanelArrayRequest) returns (GeneratePanelArrayResponse);

  // Tile-based queries
  rpc GetTiles(GetTilesRequest) returns (GetTilesResponse);
  // GetTilePanels returns individual panel geometries within a specific tile for viewport rendering.
  rpc GetTilePanels(GetTilePanelsRequest) returns (GetTilePanelsResponse);

  // Acceptance workflow — gates the LayoutReady -> ElectricalReady phase transition.
  // SubmitLayoutForReview transitions review_metadata.status to REVIEW_PENDING.
  rpc SubmitLayoutForReview(SubmitLayoutForReviewRequest) returns (SubmitLayoutForReviewResponse);
  // ApproveLayout sets review_metadata.status to APPROVED, enabling ElectricalReady transition.
  rpc ApproveLayout(ApproveLayoutRequest) returns (ApproveLayoutResponse);
  // RejectLayout sets review_metadata.status to REJECTED and records blockers preventing approval.
  rpc RejectLayout(RejectLayoutRequest) returns (RejectLayoutResponse);
}

// ========== Acceptance Status Enum ==========
// AcceptanceStatus is the workflow gate state for a layout artefact.
// Determines whether this layout satisfies the LayoutReady gate for phase progression.
enum AcceptanceStatus {
  // ACCEPTANCE_STATUS_UNSPECIFIED is the default zero value; treat as DRAFT.
  ACCEPTANCE_STATUS_UNSPECIFIED = 0;
  // ACCEPTANCE_STATUS_DRAFT indicates no review has been requested yet.
  ACCEPTANCE_STATUS_DRAFT = 1;
  // ACCEPTANCE_STATUS_REVIEW_PENDING indicates a review has been submitted and is awaiting decision.
  ACCEPTANCE_STATUS_REVIEW_PENDING = 2;
  // ACCEPTANCE_STATUS_APPROVED indicates the layout passed acceptance and may proceed.
  ACCEPTANCE_STATUS_APPROVED = 3;
  // ACCEPTANCE_STATUS_REJECTED indicates the layout failed acceptance; blockers must be resolved.
  ACCEPTANCE_STATUS_REJECTED = 4;
}

// ========== Review Metadata ==========
// ReviewMetadata captures the acceptance workflow state attached to a layout.
// Populated by the SubmitLayoutForReview / ApproveLayout / RejectLayout RPCs.
// Consumed by PlanningWorkflow gate enforcement for the LayoutReady -> ElectricalReady transition.
message ReviewMetadata {
  // status is the current acceptance gate state.
  AcceptanceStatus status = 1;
  // reviewed_by_actor_id is the user or system actor that performed the review action.
  string reviewed_by_actor_id = 2;
  // reviewed_at is the timestamp of the most recent review action.
  google.protobuf.Timestamp reviewed_at = 3;
  // quality_score is a reviewer-assigned [0, 1] quality rating.
  double quality_score = 4;
  // review_comments are free-text annotations from the reviewer.
  repeated string review_comments = 5;
  // blockers are unresolved reasons preventing approval. Empty when approved.
  repeated string blockers = 6;
  // approval_timestamp_unix_secs records the ISO-8601 approval time for the audit trail.
  string approval_timestamp_unix_secs = 7;
}

message Layout {
  string id = 1;
  string project_id = 2;
  string name = 3;
  int32 total_panels = 4;
  double total_capacity_kw = 5;
  int32 tile_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  ReviewMetadata review_metadata = 9;
  string candidate_id = 10; // Reference to MLCandidate if from algorithm
}

message Component {
  string id = 1;
  string layout_id = 2;
  string asset_id = 3;
  ComponentType component_type = 4;
  Position position = 5;
  double rotation = 6;
  string metadata_json = 7;
  google.protobuf.Timestamp created_at = 8;
}

enum ComponentType {
  COMPONENT_TYPE_UNSPECIFIED = 0;
  COMPONENT_TYPE_PANEL = 1;
  COMPONENT_TYPE_INVERTER = 2;
  COMPONENT_TYPE_TRANSFORMER = 3;
  COMPONENT_TYPE_JUNCTION_BOX = 4;
  COMPONENT_TYPE_SUBSTATION = 5;
  COMPONENT_TYPE_TRACKER = 6;
  COMPONENT_TYPE_COMBINER_BOX = 7;
}

message Position {
  double longitude = 1;
  double latitude = 2;
  double elevation = 3;
}

message LayoutTile {
  string id = 1;
  string layout_id = 2;
  BoundingBox bbox = 3;
  int32 lod_level = 4;
  int32 panel_count = 5;
  string metadata_json = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Panel {
  string id = 1;
  string tile_id = 2;
  string string_id = 3;
  // GeoJSON polygon
  string geometry_geojson = 4;
  double tilt = 5;
  double azimuth = 6;
  double elevation = 7;
  string metadata_json = 8;
}

message BoundingBox {
  double min_x = 1;
  double min_y = 2;
  double max_x = 3;
  double max_y = 4;
}

// ========== Acceptance Request/Response Messages ==========
message SubmitLayoutForReviewRequest {
  string layout_id = 1;
  string submission_reason = 2;
  string submitted_by_actor_id = 3;
}

message SubmitLayoutForReviewResponse {
  Layout layout = 1;
  ReviewMetadata review_metadata = 2;
}

message ApproveLayoutRequest {
  string layout_id = 1;
  double quality_score = 2; // [0, 1]
  repeated string approval_comments = 3;
  string approved_by_actor_id = 4;
}

message ApproveLayoutResponse {
  Layout layout = 1;
  ReviewMetadata review_metadata = 2;
}

message RejectLayoutRequest {
  string layout_id = 1;
  repeated string rejection_reasons = 2;
  string rejected_by_actor_id = 3;
}

message RejectLayoutResponse {
  Layout layout = 1;
  ReviewMetadata review_metadata = 2;
}

message PanelArrayParams {
  // Panel dimensions in meters
  double panel_width = 1;
  double panel_height = 2;
  double tilt_angle = 3;
  double azimuth = 4;
  double row_spacing = 5;
  double column_spacing = 6;
  // GeoJSON polygon for the fill area
  string fill_area_geojson = 7;
  // Optional terrain layer for alignment
  string terrain_layer_id = 8;
}

message CreateLayoutRequest {
  string project_id = 1;
  string name = 2;
}

message CreateLayoutResponse {
  Layout layout = 1;
}

message GetLayoutRequest {
  string id = 1;
}

message GetLayoutResponse {
  Layout layout = 1;
}

message ListLayoutsRequest {
  string project_id = 1;
}

message ListLayoutsResponse {
  repeated Layout layouts = 1;
}

message DeleteLayoutRequest {
  string id = 1;
}

message DeleteLayoutResponse {}

message PlaceComponentRequest {
  string layout_id = 1;
  string asset_id = 2;
  ComponentType component_type = 3;
  Position position = 4;
  double rotation = 5;
  string metadata_json = 6;
}

message PlaceComponentResponse {
  Component component = 1;
}

message MoveComponentRequest {
  string component_id = 1;
  Position position = 2;
  double rotation = 3;
}

message MoveComponentResponse {
  Component component = 1;
}

message RemoveComponentRequest {
  string component_id = 1;
}

message RemoveComponentResponse {}

message ListComponentsRequest {
  string layout_id = 1;
  ComponentType type_filter = 2;
}

message ListComponentsResponse {
  repeated Component components = 1;
}

message GeneratePanelArrayRequest {
  string layout_id = 1;
  PanelArrayParams params = 2;
}

message GeneratePanelArrayResponse {
  int32 panels_created = 1;
  int32 tiles_created = 2;
  double capacity_kw = 3;
}

message GetTilesRequest {
  string layout_id = 1;
  BoundingBox viewport = 2;
  int32 lod_level = 3;
}

message GetTilesResponse {
  repeated LayoutTile tiles = 1;
}

message GetTilePanelsRequest {
  string tile_id = 1;
}

message GetTilePanelsResponse {
  repeated Panel panels = 1;
}
