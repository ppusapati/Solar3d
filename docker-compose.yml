services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solar3d}
      POSTGRES_USER: ${POSTGRES_USER:-solar3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solar3d}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-solar3d}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Backend Services
  # ============================================================

  project-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: project-service
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      CORS_ALLOWED_ORIGIN: "${CORS_ALLOWED_ORIGIN:-*}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  terrain-service:
