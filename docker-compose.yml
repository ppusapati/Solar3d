      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "terrain"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8081/healthz"]
