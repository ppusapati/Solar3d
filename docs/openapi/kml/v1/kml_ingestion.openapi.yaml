openapi: 3.1.0
info:
  title: kml.v1
paths:
  /kml.v1.KMLIngestionService/DeleteUpload:
    post:
      tags:
        - kml.v1.KMLIngestionService
      summary: DeleteUpload
      description: DeleteUpload removes an upload job and associated geometries.
      operationId: kml.v1.KMLIngestionService.DeleteUpload
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kml.v1.DeleteUploadRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kml.v1.DeleteUploadResponse'
  /kml.v1.KMLIngestionService/GetImportedGeometry:
    post:
      tags:
        - kml.v1.KMLIngestionService
      summary: GetImportedGeometry
      description: GetImportedGeometry retrieves a single imported geometry with full details.
      operationId: kml.v1.KMLIngestionService.GetImportedGeometry
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kml.v1.GetImportedGeometryRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kml.v1.GetImportedGeometryResponse'
  /kml.v1.KMLIngestionService/GetUploadStatus:
    post:
      tags:
        - kml.v1.KMLIngestionService
      summary: GetUploadStatus
      description: GetUploadStatus retrieves the status of a KML upload job.
      operationId: kml.v1.KMLIngestionService.GetUploadStatus
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kml.v1.GetUploadStatusRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kml.v1.GetUploadStatusResponse'
  /kml.v1.KMLIngestionService/ListImportedGeometries:
    post:
      tags:
        - kml.v1.KMLIngestionService
      summary: ListImportedGeometries
      description: ListImportedGeometries retrieves geometries from a completed upload.
      operationId: kml.v1.KMLIngestionService.ListImportedGeometries
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kml.v1.ListImportedGeometriesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kml.v1.ListImportedGeometriesResponse'
  /kml.v1.KMLIngestionService/UploadKML:
    post:
      tags:
        - kml.v1.KMLIngestionService
      summary: UploadKML
      description: UploadKML initiates async KML/KMZ file processing.
      operationId: kml.v1.KMLIngestionService.UploadKML
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kml.v1.UploadKMLRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kml.v1.UploadKMLResponse'
components:
  schemas:
    common.v1.BoundingBox2D:
      type: object
      properties:
        minX:
          type: number
          title: min_x
          format: double
        minY:
          type: number
          title: min_y
          format: double
        maxX:
          type: number
          title: max_x
          format: double
        maxY:
          type: number
          title: max_y
          format: double
      title: BoundingBox2D
      additionalProperties: false
    common.v1.LineString2D:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/common.v1.Point2D'
          title: points
      title: LineString2D
      additionalProperties: false
    common.v1.MultiPolygon2D:
      type: object
      properties:
        polygons:
          type: array
          items:
            $ref: '#/components/schemas/common.v1.Polygon2D'
          title: polygons
      title: MultiPolygon2D
      additionalProperties: false
    common.v1.Point2D:
      type: object
      properties:
        x:
          type: number
          title: x
          format: double
        y:
          type: number
          title: y
          format: double
      title: Point2D
      additionalProperties: false
    common.v1.Polygon2D:
      type: object
      properties:
        rings:
          type: array
          items:
            $ref: '#/components/schemas/common.v1.LineString2D'
          title: rings
          description: First ring is outer shell, remaining rings are holes.
      title: Polygon2D
      additionalProperties: false
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    kml.v1.CRSCode:
      type: string
      title: CRSCode
      enum:
        - CRS_UNKNOWN
        - CRS_WGS84
        - CRS_WEB_MERCATOR
        - CRS_UTM
      description: Canonical coordinate reference system codes.
    kml.v1.DeleteUploadRequest:
      type: object
      properties:
        uploadJobId:
          type: string
          title: upload_job_id
      title: DeleteUploadRequest
      additionalProperties: false
      description: Request to delete upload job and all associated geometries.
    kml.v1.DeleteUploadResponse:
      type: object
      properties:
        uploadJobId:
          type: string
          title: upload_job_id
        deleted:
          type: boolean
          title: deleted
        geometriesDeleted:
          type: integer
          title: geometries_deleted
          format: int32
      title: DeleteUploadResponse
      additionalProperties: false
      description: Response confirming deletion.
    kml.v1.GeometryType:
      type: string
      title: GeometryType
      enum:
        - TYPE_UNKNOWN
        - TYPE_POINT
        - TYPE_LINESTRING
        - TYPE_POLYGON
        - TYPE_MULTIPOLYGON
      description: Canonical geometry type.
    kml.v1.GetImportedGeometryRequest:
      type: object
      properties:
        uploadJobId:
          type: string
          title: upload_job_id
        geometryId:
          type: string
          title: geometry_id
      title: GetImportedGeometryRequest
      additionalProperties: false
      description: Request to retrieve full details of imported geometry.
    kml.v1.GetImportedGeometryResponse:
      type: object
      allOf:
        - properties:
            geometryId:
              type: string
              title: geometry_id
            name:
              type: string
              title: name
            description:
              type: string
              title: description
            properties:
              type: object
              title: properties
              additionalProperties:
                type: string
                title: value
              description: Original KML properties (key-value pairs).
            type:
              title: type
              description: Geometry type.
              $ref: '#/components/schemas/kml.v1.GeometryType'
            sourceCrs:
              title: source_crs
              description: Source CRS of original geometry.
              $ref: '#/components/schemas/kml.v1.CRSCode'
            boundingBox:
              title: bounding_box
              description: Canonical bounding box.
              $ref: '#/components/schemas/common.v1.BoundingBox2D'
            geometryHash:
              type: string
              title: geometry_hash
              description: Checksum of geometry for validation.
            importedAt:
              title: imported_at
              description: Timestamp when geometry was imported.
              $ref: '#/components/schemas/google.protobuf.Timestamp'
        - oneOf:
            - type: object
              properties:
                linestring:
                  title: linestring
                  $ref: '#/components/schemas/common.v1.LineString2D'
              title: linestring
              required:
                - linestring
            - type: object
              properties:
                multipolygon:
                  title: multipolygon
                  $ref: '#/components/schemas/common.v1.MultiPolygon2D'
              title: multipolygon
              required:
                - multipolygon
            - type: object
              properties:
                point:
                  title: point
                  $ref: '#/components/schemas/common.v1.Point2D'
              title: point
              required:
                - point
            - type: object
              properties:
                polygon:
                  title: polygon
                  $ref: '#/components/schemas/common.v1.Polygon2D'
              title: polygon
              required:
                - polygon
      title: GetImportedGeometryResponse
      additionalProperties: false
      description: Full details of imported geometry.
    kml.v1.GetImportedGeometryResponse.PropertiesEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: PropertiesEntry
      additionalProperties: false
    kml.v1.GetUploadStatusRequest:
      type: object
      properties:
        uploadJobId:
          type: string
          title: upload_job_id
      title: GetUploadStatusRequest
      additionalProperties: false
      description: Request to check status of upload job.
    kml.v1.GetUploadStatusResponse:
      type: object
      properties:
        uploadJobId:
          type: string
          title: upload_job_id
        status:
          title: status
          $ref: '#/components/schemas/kml.v1.UploadStatus'
        featuresProcessed:
          type: integer
          title: features_processed
          format: int32
          description: Number of features parsed so far.
        totalFeatures:
          type: integer
          title: total_features
          format: int32
          description: Total features in file (0 if still parsing).
        errorMessage:
          type: string
          title: error_message
          description: Error message if status is FAILED.
        startedAt:
          title: started_at
          description: Timestamp when processing started.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        completedAt:
          title: completed_at
          description: Timestamp when processing completed (if done).
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        detectedCrs:
          title: detected_crs
          description: Detected CRS of source file.
          $ref: '#/components/schemas/kml.v1.CRSCode'
      title: GetUploadStatusResponse
      additionalProperties: false
      description: Response with upload job status and progress.
    kml.v1.ImportedGeometryStub:
      type: object
      properties:
        geometryId:
          type: string
          title: geometry_id
          description: Unique geometry ID within upload.
        name:
          type: string
          title: name
          description: Feature name from KML.
        type:
          title: type
          description: Geometry type.
          $ref: '#/components/schemas/kml.v1.GeometryType'
        boundingBox:
          title: bounding_box
          description: Canonical bounding box (WGS84).
          $ref: '#/components/schemas/common.v1.BoundingBox2D'
        featureCount:
          type: integer
          title: feature_count
          format: int32
          description: Feature count for multi-geometries.
      title: ImportedGeometryStub
      additionalProperties: false
      description: Imported geometry with minimal metadata.
    kml.v1.ListImportedGeometriesRequest:
      type: object
      properties:
        uploadJobId:
          type: string
          title: upload_job_id
        geometryType:
          title: geometry_type
          description: 'Optional filter: return only geometries of this type.'
          $ref: '#/components/schemas/kml.v1.GeometryType'
        limit:
          type: integer
          title: limit
          format: int32
          description: Optional pagination limit.
        offset:
          type: integer
          title: offset
          format: int32
          description: Optional pagination offset.
      title: ListImportedGeometriesRequest
      additionalProperties: false
      description: Request to list imported geometries from completed upload.
    kml.v1.ListImportedGeometriesResponse:
      type: object
      properties:
        geometries:
          type: array
          items:
            $ref: '#/components/schemas/kml.v1.ImportedGeometryStub'
          title: geometries
        totalCount:
          type: integer
          title: total_count
          format: int32
          description: Total count of geometries in upload.
      title: ListImportedGeometriesResponse
      additionalProperties: false
      description: Response with list of imported geometries.
    kml.v1.UploadKMLRequest:
      type: object
      properties:
        fileData:
          type: string
          title: file_data
          format: byte
          description: File content (raw KML or zipped KMZ).
        fileName:
          type: string
          title: file_name
          description: File name (used to determine if it's KML or KMZ).
        sourceCrs:
          title: source_crs
          description: Optional hint about source CRS if not detectable from KML.
          $ref: '#/components/schemas/kml.v1.CRSCode'
        projectId:
          type: string
          title: project_id
          description: Optional project/site ID for grouping imports.
        tags:
          type: object
          title: tags
          additionalProperties:
            type: string
            title: value
          description: Optional metadata tags.
      title: UploadKMLRequest
      additionalProperties: false
      description: Request to upload KML/KMZ file for import.
    kml.v1.UploadKMLRequest.TagsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: TagsEntry
      additionalProperties: false
    kml.v1.UploadKMLResponse:
      type: object
      properties:
        uploadJobId:
          type: string
          title: upload_job_id
          description: Unique job ID for tracking progress.
        status:
          title: status
          description: Initial status.
          $ref: '#/components/schemas/kml.v1.UploadStatus'
        createdAt:
          title: created_at
          description: Timestamp when upload was created.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: UploadKMLResponse
      additionalProperties: false
      description: Response to upload request with job tracking ID.
    kml.v1.UploadStatus:
      type: string
      title: UploadStatus
      enum:
        - STATUS_UNKNOWN
        - STATUS_PENDING
        - STATUS_PROCESSING
        - STATUS_COMPLETED
        - STATUS_FAILED
      description: Status of KML upload job.
security: []
tags:
  - name: kml.v1.KMLIngestionService
    description: KMLIngestionService exposes KML/KMZ upload, parsing, and geometry import workflows.
