          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ProtectionStudy
      additionalProperties: false
    protection.v1.RelayCharacteristic:
      type: string
      title: RelayCharacteristic
      enum:
        - RELAY_CHARACTERISTIC_UNSPECIFIED
        - RELAY_CHARACTERISTIC_STANDARD_INVERSE
        - RELAY_CHARACTERISTIC_VERY_INVERSE
        - RELAY_CHARACTERISTIC_EXTREMELY_INVERSE
        - RELAY_CHARACTERISTIC_DEFINITE_TIME
    protection.v1.RelaySelection:
      type: object
      properties:
        relayId:
          type: string
          title: relay_id
          description: deterministically generated reference
        makeModel:
          type: string
          title: make_model
          description: e.g. "IEC 60255-151 compliant OCDT relay"
        characteristic:
          title: characteristic
          $ref: '#/components/schemas/protection.v1.RelayCharacteristic'
        pickupCurrentA:
          type: number
          title: pickup_current_a
          format: double
          description: I_pickup = 1.2 × I_load
        timeDialSetting:
          type: number
          title: time_dial_setting
          format: double
          description: TDS (starting point)
        rationale:
          type: string
          title: rationale
      title: RelaySelection
      additionalProperties: false
    protection.v1.SelectRelayRequest:
      type: object
      properties:
        studyId:
          type: string
          title: study_id
        faultCurrentKa:
          type: number
          title: fault_current_ka
          format: double
          description: maximum fault current at location
        loadCurrentA:
          type: number
          title: load_current_a
          format: double
          description: normal load current (for pickup setting)
        preferredCharacteristic:
          title: preferred_characteristic
          description: preference
          $ref: '#/components/schemas/protection.v1.RelayCharacteristic'
      title: SelectRelayRequest
      additionalProperties: false
    protection.v1.SelectRelayResponse:
      type: object
      properties:
        studyId:
          type: string
          title: study_id
        relay:
          title: relay
          $ref: '#/components/schemas/protection.v1.RelaySelection'
      title: SelectRelayResponse
      additionalProperties: false
    protection.v1.ValidateCoordinationRequest:
      type: object
      properties:
        studyId:
          type: string
          title: study_id
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/protection.v1.CoordinationPair'
          title: pairs
        minimumMarginS:
          type: number
          title: minimum_margin_s
          format: double
          description: IEC default 0.3 s
      title: ValidateCoordinationRequest
      additionalProperties: false
    protection.v1.ValidateCoordinationResponse:
      type: object
      properties:
        valid:
          type: boolean
          title: valid
        violations:
          type: array
          items:
            $ref: '#/components/schemas/protection.v1.CoordinationViolation'
          title: violations
      title: ValidateCoordinationResponse
      additionalProperties: false
security: []
tags:
  - name: protection.v1.ProtectionService
    description: |-
      ProtectionService implements IEC 60909 short-circuit and IEC 60255 protective
       relay studies for solar plant HV/MV networks.
