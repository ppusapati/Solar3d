        targetPhase:
          title: target_phase
          $ref: '#/components/schemas/planning.v1.WorkflowPhase'
        evidence:
          title: evidence
          description: Evidence required for target phase
          $ref: '#/components/schemas/planning.v1.TransitionEvidence'
        actorId:
          type: string
          title: actor_id
          description: User or system initiating transition
        reason:
          type: string
          title: reason
          description: Human-readable transition reason
      title: TransitionPhaseRequest
      additionalProperties: false
    planning.v1.TransitionPhaseResponse:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        previousPhase:
          title: previous_phase
          $ref: '#/components/schemas/planning.v1.WorkflowPhase'
        currentPhase:
          title: current_phase
          $ref: '#/components/schemas/planning.v1.WorkflowPhase'
        transitionRecord:
          title: transition_record
          description: The created transition record
          $ref: '#/components/schemas/planning.v1.PhaseTransition'
        wasNoop:
          type: boolean
          title: was_noop
          description: True if already in target phase
      title: TransitionPhaseResponse
      additionalProperties: false
    planning.v1.TransmissionSignoff:
      type: object
      properties:
        electricalLayoutId:
          type: string
          title: electrical_layout_id
        transmissionRouteId:
          type: string
          title: transmission_route_id
          description: Reference to transmission service route
        approvedByActorId:
          type: string
          title: approved_by_actor_id
        approvedAt:
          title: approved_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        protectionDevices:
          type: array
          items:
            type: string
          title: protection_devices
        faultIsolationPoints:
          type: integer
          title: fault_isolation_points
          format: int32
      title: TransmissionSignoff
      additionalProperties: false
      description: 'TransmissionSignoff evidence: Transmission routing and protection complete.'
    planning.v1.ValidatePhaseReadinessRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        targetPhase:
          title: target_phase
          description: Check if transition to this phase is valid
          $ref: '#/components/schemas/planning.v1.WorkflowPhase'
        evidence:
          title: evidence
          description: 'Optional: validate with provided evidence'
          $ref: '#/components/schemas/planning.v1.TransitionEvidence'
      title: ValidatePhaseReadinessRequest
      additionalProperties: false
    planning.v1.ValidatePhaseReadinessResponse:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        currentPhase:
          title: current_phase
          $ref: '#/components/schemas/planning.v1.WorkflowPhase'
        targetPhase:
          title: target_phase
          $ref: '#/components/schemas/planning.v1.WorkflowPhase'
        isValid:
          type: boolean
          title: is_valid
          description: True if transition is allowed
        blockerReasons:
          type: array
          items:
            type: string
          title: blocker_reasons
          description: Non-empty list explains why transition would fail
        canTransitionAfter:
          title: can_transition_after
          description: 'Optional: when blockers lift'
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ValidatePhaseReadinessResponse
      additionalProperties: false
    planning.v1.WorkflowPhase:
      type: string
      title: WorkflowPhase
      enum:
        - WORKFLOW_PHASE_UNSPECIFIED
        - PLANNING
        - LAYOUT_READY
        - ELECTRICAL_READY
        - TRANSMISSION_READY
        - REVIEW_READY
        - APPROVED
        - COMMISSIONING_READY
        - ARCHIVED
    planning.v1.WorkflowState:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        currentPhase:
          title: current_phase
          $ref: '#/components/schemas/planning.v1.WorkflowPhase'
        phaseEnteredAt:
          title: phase_entered_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        totalTransitions:
          type: integer
          title: total_transitions
          format: int32
          description: Count of all transitions
        activeBlockers:
          type: array
          items:
            type: string
          title: active_blockers
          description: Blockers preventing further progress
        actorBlockedSince:
          type: string
          title: actor_blocked_since
          description: Actor ID if phase transition is blocked
      title: WorkflowState
      additionalProperties: false
      description: WorkflowState represents the immutable state snapshot at any point.
security: []
tags:
  - name: planning.v1.PlanningWorkflowService
    description: |-
      PlanningWorkflowService manages transitions through the planning, design,
       validation, and approval workflow phases for solar projects.

       The workflow is deterministic and sequential: projects progress from Planning
       through LayoutReady, ElectricalReady, TransmissionReady, ReviewReady, Approved,
       and finally CommissioningReady. Each transition is gated by predecessor phase
       acceptance and validated evidence payloads.
