        - JOB_TYPE_REGENERATE
        - JOB_TYPE_IMPORT
        - JOB_TYPE_PUBLISH
        - JOB_TYPE_SIMULATION
        - JOB_TYPE_OPTIMIZATION
        - JOB_TYPE_CUSTOM
        - JOB_TYPE_STRUCTURAL_LOAD_ANALYSIS
        - JOB_TYPE_PROTECTION_STUDY
        - JOB_TYPE_COMMISSIONING
