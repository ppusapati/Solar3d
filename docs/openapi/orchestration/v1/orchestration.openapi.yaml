openapi: 3.1.0
info:
  title: orchestration.v1
paths:
  /orchestration.v1.ComputeOrchestrationService/CancelJob:
    post:
      tags:
        - orchestration.v1.ComputeOrchestrationService
      summary: CancelJob
      description: CancelJob requests cancelation for a queued or running job.
      operationId: orchestration.v1.ComputeOrchestrationService.CancelJob
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orchestration.v1.CancelJobRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orchestration.v1.CancelJobResponse'
  /orchestration.v1.ComputeOrchestrationService/GetDeadLetter:
    post:
      tags:
        - orchestration.v1.ComputeOrchestrationService
      summary: GetDeadLetter
      description: GetDeadLetter returns details of a specific dead-lettered job.
      operationId: orchestration.v1.ComputeOrchestrationService.GetDeadLetter
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orchestration.v1.GetDeadLetterRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orchestration.v1.GetDeadLetterResponse'
  /orchestration.v1.ComputeOrchestrationService/GetJob:
    post:
      tags:
        - orchestration.v1.ComputeOrchestrationService
      summary: GetJob
      description: GetJob returns the latest state of a compute job.
      operationId: orchestration.v1.ComputeOrchestrationService.GetJob
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orchestration.v1.GetJobRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orchestration.v1.GetJobResponse'
  /orchestration.v1.ComputeOrchestrationService/ListDeadLetters:
    post:
      tags:
        - orchestration.v1.ComputeOrchestrationService
      summary: ListDeadLetters
      description: ListDeadLetters returns dead-lettered jobs for a project.
      operationId: orchestration.v1.ComputeOrchestrationService.ListDeadLetters
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orchestration.v1.ListDeadLettersRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orchestration.v1.ListDeadLettersResponse'
  /orchestration.v1.ComputeOrchestrationService/ListJobs:
    post:
      tags:
        - orchestration.v1.ComputeOrchestrationService
      summary: ListJobs
      description: ListJobs returns jobs optionally filtered by status.
      operationId: orchestration.v1.ComputeOrchestrationService.ListJobs
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orchestration.v1.ListJobsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orchestration.v1.ListJobsResponse'
  /orchestration.v1.ComputeOrchestrationService/RetryJob:
    post:
      tags:
        - orchestration.v1.ComputeOrchestrationService
      summary: RetryJob
      description: RetryJob retries a failed or canceled job.
      operationId: orchestration.v1.ComputeOrchestrationService.RetryJob
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orchestration.v1.RetryJobRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orchestration.v1.RetryJobResponse'
  /orchestration.v1.ComputeOrchestrationService/SubmitJob:
    post:
      tags:
        - orchestration.v1.ComputeOrchestrationService
      summary: SubmitJob
      description: SubmitJob enqueues a new compute job for asynchronous processing.
      operationId: orchestration.v1.ComputeOrchestrationService.SubmitJob
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orchestration.v1.SubmitJobRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orchestration.v1.SubmitJobResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    orchestration.v1.Artifact:
      type: object
      properties:
        kind:
          type: string
          title: kind
        uri:
          type: string
          title: uri
        checksum:
          type: string
          title: checksum
        sizeBytes:
          type:
            - integer
            - string
          title: size_bytes
          format: int64
      title: Artifact
      additionalProperties: false
    orchestration.v1.CancelJobRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: CancelJobRequest
      additionalProperties: false
    orchestration.v1.CancelJobResponse:
      type: object
      properties:
        job:
          title: job
          $ref: '#/components/schemas/orchestration.v1.Job'
      title: CancelJobResponse
      additionalProperties: false
    orchestration.v1.DeadLetter:
      type: object
      properties:
        id:
          type: string
          title: id
        jobId:
          type: string
          title: job_id
        reason:
          type: string
          title: reason
        payloadJson:
          type: string
          title: payload_json
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: DeadLetter
      additionalProperties: false
    orchestration.v1.GetDeadLetterRequest:
      type: object
      properties:
        jobId:
          type: string
          title: job_id
      title: GetDeadLetterRequest
      additionalProperties: false
    orchestration.v1.GetDeadLetterResponse:
      type: object
      properties:
        deadLetter:
          title: dead_letter
          $ref: '#/components/schemas/orchestration.v1.DeadLetter'
      title: GetDeadLetterResponse
      additionalProperties: false
    orchestration.v1.GetJobRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: GetJobRequest
      additionalProperties: false
    orchestration.v1.GetJobResponse:
      type: object
      properties:
        job:
          title: job
          $ref: '#/components/schemas/orchestration.v1.Job'
      title: GetJobResponse
      additionalProperties: false
    orchestration.v1.Job:
      type: object
      properties:
        id:
          type: string
          title: id
        projectId:
          type: string
          title: project_id
        type:
          title: type
          $ref: '#/components/schemas/orchestration.v1.JobType'
        status:
          title: status
          $ref: '#/components/schemas/orchestration.v1.JobStatus'
        priority:
          type: integer
          title: priority
          format: int32
        attempts:
          type: integer
          title: attempts
          format: int32
        maxAttempts:
          type: integer
          title: max_attempts
          format: int32
        payloadJson:
          type: string
          title: payload_json
        errorMessage:
          type: string
          title: error_message
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/orchestration.v1.Artifact'
          title: artifacts
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        startedAt:
          title: started_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        completedAt:
          title: completed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        nextRetryAt:
          title: next_retry_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Job
      additionalProperties: false
    orchestration.v1.JobStatus:
      type: string
      title: JobStatus
      enum:
        - JOB_STATUS_UNSPECIFIED
        - JOB_STATUS_QUEUED
        - JOB_STATUS_RUNNING
        - JOB_STATUS_SUCCEEDED
        - JOB_STATUS_FAILED
        - JOB_STATUS_CANCELED
        - JOB_STATUS_RETRY_PENDING
    orchestration.v1.JobType:
      type: string
      title: JobType
      enum:
