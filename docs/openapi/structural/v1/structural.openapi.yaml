components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    structural.v1.ApproveDesignRequest:
      type: object
      properties:
        designId:
          type: string
          title: design_id
        approvedBy:
          type: string
          title: approved_by
        notes:
          type: string
          title: notes
      title: ApproveDesignRequest
      additionalProperties: false
    structural.v1.ApproveDesignResponse:
      type: object
      properties:
        design:
          title: design
          $ref: '#/components/schemas/structural.v1.StructuralDesign'
      title: ApproveDesignResponse
      additionalProperties: false
    structural.v1.ComputeDeadLoadRequest:
      type: object
      properties:
        designId:
          type: string
          title: design_id
        panelCount:
          type: integer
          title: panel_count
          format: int32
        panelMassKg:
          type: number
          title: panel_mass_kg
          format: double
          description: mass per panel (default 25 kg)
        mountingMassPerPanelKg:
          type: number
          title: mounting_mass_per_panel_kg
          format: double
          description: mass of rails/clamps per panel (default 15 kg)
        cableMassKg:
          type: number
          title: cable_mass_kg
          format: double
          description: total cabling mass
      title: ComputeDeadLoadRequest
      additionalProperties: false
    structural.v1.ComputeDeadLoadResponse:
      type: object
      properties:
        designId:
          type: string
          title: design_id
        panelMassTotalKg:
          type: number
          title: panel_mass_total_kg
          format: double
        mountingMassTotalKg:
          type: number
          title: mounting_mass_total_kg
          format: double
        cableMassKg:
          type: number
          title: cable_mass_kg
          format: double
        totalMassKg:
          type: number
          title: total_mass_kg
          format: double
        deadLoadKn:
          type: number
          title: dead_load_kn
          format: double
          description: total_mass × g / 1000
        equation:
          type: string
          title: equation
          description: human-readable equation used
      title: ComputeDeadLoadResponse
      additionalProperties: false
    structural.v1.ComputeFoundationRequirementRequest:
      type: object
      properties:
        designId:
          type: string
          title: design_id
        deadLoadKn:
          type: number
          title: dead_load_kn
          format: double
        windLoadKn:
          type: number
          title: wind_load_kn
          format: double
        seismicLoadKn:
          type: number
          title: seismic_load_kn
          format: double
        foundationType:
          title: foundation_type
          $ref: '#/components/schemas/structural.v1.FoundationType'
        pileCapacityKn:
          type: number
          title: pile_capacity_kn
          format: double
          description: allowable load per pile/anchor (default 50 kN)
        totalAreaSqm:
          type: number
          title: total_area_sqm
          format: double
          description: footprint for spacing calculation
      title: ComputeFoundationRequirementRequest
      additionalProperties: false
    structural.v1.ComputeFoundationRequirementResponse:
      type: object
      properties:
        designId:
          type: string
          title: design_id
        result:
          title: result
          $ref: '#/components/schemas/structural.v1.FoundationResult'
        equation:
          type: string
          title: equation
      title: ComputeFoundationRequirementResponse
      additionalProperties: false
    structural.v1.ComputeSeismicLoadRequest:
      type: object
      properties:
        designId:
          type: string
          title: design_id
        sds:
          type: number
          title: sds
          format: double
          description: Design spectral acceleration (g), 0.2s period
        totalMassKg:
          type: number
          title: total_mass_kg
          format: double
          description: Seismic weight W = dead load
        rFactor:
          type: number
          title: r_factor
          format: double
          description: Response modification factor (default 1.5 for freestanding)
        importanceFactor:
          type: number
          title: importance_factor
          format: double
          description: I_e (default 1.0)
        csOverride:
          type: number
          title: cs_override
          format: double
          description: leave 0 for code minimum
      title: ComputeSeismicLoadRequest
      additionalProperties: false
    structural.v1.ComputeSeismicLoadResponse:
      type: object
      properties:
        designId:
          type: string
          title: design_id
        cs:
          type: number
          title: cs
          format: double
          description: seismic response coefficient
        seismicWeightKn:
          type: number
          title: seismic_weight_kn
          format: double
          description: W in kN
        baseShearKn:
          type: number
          title: base_shear_kn
          format: double
          description: V = Cs × W
        equation:
          type: number
          title: equation
          format: double
          description: reserved – use string representation
        equationStr:
          type: string
          title: equation_str
      title: ComputeSeismicLoadResponse
      additionalProperties: false
    structural.v1.ComputeWindLoadRequest:
      type: object
      properties:
        designId:
          type: string
          title: design_id
        windSpeedMS:
          type: number
          title: wind_speed_m_s
          format: double
          description: 3-second gust design wind speed (m/s)
        exposure:
          title: exposure
          $ref: '#/components/schemas/structural.v1.ExposureCategory'
        heightM:
          type: number
          title: height_m
          format: double
          description: mean roof / mounting height above grade
        panelTiltDeg:
          type: number
          title: panel_tilt_deg
          format: double
          description: panel tilt from horizontal (°)
        totalPanelAreaSqm:
          type: number
          title: total_panel_area_sqm
          format: double
        kZt:
          type: number
          title: k_zt
          format: double
          description: Optional — if 0, code defaults are used topographic factor (default 1.0)
        kD:
          type: number
          title: k_d
          format: double
          description: directionality factor (default 0.85)
        gustFactor:
          type: number
          title: gust_factor
          format: double
          description: G (default 0.85)
