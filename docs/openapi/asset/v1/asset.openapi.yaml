openapi: 3.1.0
info:
  title: asset.v1
paths:
  /asset.v1.AssetService/CreateAsset:
    post:
      tags:
        - asset.v1.AssetService
      summary: CreateAsset
      operationId: asset.v1.AssetService.CreateAsset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asset.v1.CreateAssetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/asset.v1.CreateAssetResponse'
  /asset.v1.AssetService/DeleteAsset:
    post:
      tags:
        - asset.v1.AssetService
      summary: DeleteAsset
      operationId: asset.v1.AssetService.DeleteAsset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asset.v1.DeleteAssetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/asset.v1.DeleteAssetResponse'
  /asset.v1.AssetService/GetAsset:
    post:
      tags:
        - asset.v1.AssetService
      summary: GetAsset
      operationId: asset.v1.AssetService.GetAsset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asset.v1.GetAssetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/asset.v1.GetAssetResponse'
  /asset.v1.AssetService/ListAssets:
    post:
      tags:
        - asset.v1.AssetService
      summary: ListAssets
      operationId: asset.v1.AssetService.ListAssets
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asset.v1.ListAssetsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/asset.v1.ListAssetsResponse'
  /asset.v1.AssetService/UpdateAsset:
    post:
      tags:
        - asset.v1.AssetService
      summary: UpdateAsset
      operationId: asset.v1.AssetService.UpdateAsset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/asset.v1.UpdateAssetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/asset.v1.UpdateAssetResponse'
components:
  schemas:
    asset.v1.Asset:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        manufacturer:
          type: string
          title: manufacturer
        model:
          type: string
          title: model
        category:
          title: category
          $ref: '#/components/schemas/asset.v1.AssetCategory'
        dimensions:
          title: dimensions
          $ref: '#/components/schemas/asset.v1.Dimensions'
        electrical:
          title: electrical
          $ref: '#/components/schemas/asset.v1.ElectricalParameters'
        model3dPath:
          type: string
          title: model_3d_path
        datasheetPath:
          type: string
          title: datasheet_path
        metadataJson:
          type: string
          title: metadata_json
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Asset
      additionalProperties: false
    asset.v1.AssetCategory:
      type: string
      title: AssetCategory
      enum:
        - ASSET_CATEGORY_UNSPECIFIED
        - ASSET_CATEGORY_SOLAR_PANEL
        - ASSET_CATEGORY_TRACKER
        - ASSET_CATEGORY_STRING_INVERTER
        - ASSET_CATEGORY_CENTRAL_INVERTER
        - ASSET_CATEGORY_TRANSFORMER
        - ASSET_CATEGORY_JUNCTION_BOX
        - ASSET_CATEGORY_COMBINER_BOX
        - ASSET_CATEGORY_CABLE
        - ASSET_CATEGORY_MOUNTING_STRUCTURE
        - ASSET_CATEGORY_SUBSTATION
    asset.v1.CellTechnology:
      type: string
      title: CellTechnology
      enum:
        - CELL_TECHNOLOGY_UNSPECIFIED
        - CELL_TECHNOLOGY_MONO_PERC
        - CELL_TECHNOLOGY_POLY
        - CELL_TECHNOLOGY_TOPCON
        - CELL_TECHNOLOGY_HJT
        - CELL_TECHNOLOGY_IBC
        - CELL_TECHNOLOGY_THIN_FILM
        - CELL_TECHNOLOGY_PERC_PLUS
      description: |-
        CellTechnology captures the PV cell architecture. Drives efficiency, temp
         coefficients, and bifacial behavior in downstream modeling.
    asset.v1.CreateAssetRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        manufacturer:
          type: string
          title: manufacturer
        model:
          type: string
          title: model
        category:
          title: category
          $ref: '#/components/schemas/asset.v1.AssetCategory'
        dimensions:
          title: dimensions
          $ref: '#/components/schemas/asset.v1.Dimensions'
        electrical:
          title: electrical
          $ref: '#/components/schemas/asset.v1.ElectricalParameters'
        model3dPath:
          type: string
          title: model_3d_path
        metadataJson:
          type: string
          title: metadata_json
      title: CreateAssetRequest
      additionalProperties: false
    asset.v1.CreateAssetResponse:
      type: object
      properties:
        asset:
          title: asset
          $ref: '#/components/schemas/asset.v1.Asset'
      title: CreateAssetResponse
      additionalProperties: false
    asset.v1.DeleteAssetRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: DeleteAssetRequest
      additionalProperties: false
    asset.v1.DeleteAssetResponse:
      type: object
      title: DeleteAssetResponse
      additionalProperties: false
    asset.v1.Dimensions:
      type: object
      properties:
        widthMm:
          type: number
          title: width_mm
          format: double
        heightMm:
          type: number
          title: height_mm
          format: double
        depthMm:
          type: number
          title: depth_mm
          format: double
        weightKg:
          type: number
          title: weight_kg
          format: double
        cellCount:
          type: integer
          title: cell_count
          format: int32
          description: Panel-specific mechanical details used by structural + mounting calculations. e.g. 144, 132, 120
        cellTechnology:
          title: cell_technology
          description: mono-facial mono PERC, TOPCon, HJT, etc.
          $ref: '#/components/schemas/asset.v1.CellTechnology'
        frameType:
          title: frame_type
          description: anodized aluminum, black anodized, frameless
          $ref: '#/components/schemas/asset.v1.FrameType'
        mountingHoleCount:
          type: integer
          title: mounting_hole_count
          format: int32
          description: typical 8 for 72-cell, 4 for smaller modules
      title: Dimensions
      additionalProperties: false
    asset.v1.ElectricalParameters:
      type: object
      properties:
        ratedPowerW:
          type: number
          title: rated_power_w
          format: double
          description: '========== Panel parameters (STC: 1000 W/m², 25°C, AM1.5) ========== Pmax (W)'
        voc:
          type: number
          title: voc
          format: double
          description: Voc (V)
        isc:
          type: number
          title: isc
          format: double
          description: Isc (A)
        vmp:
          type: number
          title: vmp
          format: double
          description: Vmp (V)
        imp:
          type: number
          title: imp
          format: double
          description: Imp (A)
        efficiency:
          type: number
          title: efficiency
          format: double
          description: module efficiency (0-1)
        tempCoefficientPmax:
          type: number
          title: temp_coefficient_pmax
          format: double
          description: γ (%/°C) — typically negative
        tempCoefficientVoc:
          type: number
          title: temp_coefficient_voc
          format: double
          description: β (%/°C) — typically negative
        maxDcInputW:
          type: number
          title: max_dc_input_w
          format: double
          description: ========== Inverter parameters ==========
        maxAcOutputW:
          type: number
          title: max_ac_output_w
          format: double
        mpptCount:
          type: integer
          title: mppt_count
          format: int32
        maxInputVoltage:
          type: number
          title: max_input_voltage
          format: double
        minInputVoltage:
          type: number
          title: min_input_voltage
          format: double
        maxStringsPerMppt:
          type: integer
          title: max_strings_per_mppt
          format: int32
        kvaRating:
          type: number
          title: kva_rating
          format: double
          description: ========== Transformer parameters ==========
        primaryVoltage:
          type: number
          title: primary_voltage
          format: double
        secondaryVoltage:
          type: number
          title: secondary_voltage
          format: double
        tempCoefficientIsc:
          type: number
          title: temp_coefficient_isc
          format: double
          description: ========== Extended panel parameters (PAN-sourced) ========== α (%/°C) — typically small positive
        noctC:
          type: number
          title: noct_c
          format: double
          description: Nominal Operating Cell Temperature (°C), typically 43-48
        bifacialFactor:
          type: number
          title: bifacial_factor
          format: double
          description: 0 for mono-facial, 0.65-0.85 for bifacial modules
        maxSystemVoltage:
          type: number
          title: max_system_voltage
          format: double
          description: UL/IEC system voltage rating (e.g. 1500)
        seriesFuseRatingA:
          type: number
          title: series_fuse_rating_a
          format: double
          description: max series fuse for string protection
        nominalPowerTolerancePct:
          type: number
          title: nominal_power_tolerance_pct
          format: double
          description: manufacturer tolerance (e.g. +3/0%)
        cellsInSeries:
          type: integer
          title: cells_in_series
          format: int32
          description: Cell-level reference for single-diode models. Populated from PAN; optional.
        cellsInParallel:
          type: integer
          title: cells_in_parallel
          format: int32
        euroEfficiency:
          type: number
          title: euro_efficiency
          format: double
          description: ========== Extended inverter parameters (OND-sourced) ========== European weighted efficiency (0-1)
        cecEfficiency:
          type: number
          title: cec_efficiency
          format: double
          description: CEC weighted efficiency (0-1)
        maxEfficiency:
          type: number
          title: max_efficiency
          format: double
          description: peak efficiency (0-1)
        mpptMinVoltage:
          type: number
          title: mppt_min_voltage
          format: double
          description: MPPT tracking range lower bound (V)
        mpptMaxVoltage:
          type: number
          title: mppt_max_voltage
          format: double
          description: MPPT tracking range upper bound (V)
        startupVoltage:
          type: number
          title: startup_voltage
          format: double
          description: DC voltage at which inverter begins tracking (V)
        maxDcInputCurrentA:
          type: number
          title: max_dc_input_current_a
          format: double
          description: total DC input current limit (A)
        maxOutputCurrentA:
          type: number
          title: max_output_current_a
          format: double
          description: nominal AC output current (A)
        ratedAcOutputW:
          type: number
          title: rated_ac_output_w
          format: double
          description: continuous AC output at rated conditions (W)
        acPhaseCount:
          type: integer
          title: ac_phase_count
          format: int32
          description: 1 for residential, 3 for commercial/utility
        acFrequencyHz:
          type: number
          title: ac_frequency_hz
          format: double
          description: 50 or 60
        nominalAcVoltage:
          type: number
          title: nominal_ac_voltage
          format: double
          description: nominal output voltage (V)
        nightConsumptionW:
          type: number
          title: night_consumption_w
          format: double
          description: self-consumption at night (W)
        operatingTempMinC:
          type: number
          title: operating_temp_min_c
          format: double
          description: °C
        operatingTempMaxC:
          type: number
          title: operating_temp_max_c
          format: double
          description: °C
        topology:
          title: topology
          $ref: '#/components/schemas/asset.v1.InverterTopology'
        gridType:
          title: grid_type
          $ref: '#/components/schemas/asset.v1.InverterGridType'
      title: ElectricalParameters
      additionalProperties: false
    asset.v1.FrameType:
      type: string
      title: FrameType
      enum:
        - FRAME_TYPE_UNSPECIFIED
        - FRAME_TYPE_ANODIZED_ALUMINUM
        - FRAME_TYPE_BLACK_ANODIZED
        - FRAME_TYPE_FRAMELESS
      description: FrameType identifies module frame material/finish; affects clamp selection.
    asset.v1.GetAssetRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: GetAssetRequest
      additionalProperties: false
    asset.v1.GetAssetResponse:
      type: object
      properties:
        asset:
          title: asset
          $ref: '#/components/schemas/asset.v1.Asset'
      title: GetAssetResponse
      additionalProperties: false
    asset.v1.InverterGridType:
      type: string
      title: InverterGridType
      enum:
        - INVERTER_GRID_TYPE_UNSPECIFIED
        - INVERTER_GRID_TYPE_GRID_TIED
        - INVERTER_GRID_TYPE_HYBRID
        - INVERTER_GRID_TYPE_OFF_GRID
      description: |-
        InverterGridType describes how the inverter interacts with the utility grid
         and local storage. Gates which downstream features (battery dispatch,
         anti-islanding protection) are applicable.
    asset.v1.InverterTopology:
      type: string
      title: InverterTopology
      enum:
        - INVERTER_TOPOLOGY_UNSPECIFIED
        - INVERTER_TOPOLOGY_TRANSFORMER_LESS
        - INVERTER_TOPOLOGY_HF_TRANSFORMER
        - INVERTER_TOPOLOGY_LF_TRANSFORMER
      description: |-
        InverterTopology identifies the galvanic isolation architecture. Drives
         grounding strategy, arc-fault detection requirements, and efficiency curve
         shape. Modern utility-scale string inverters are almost universally
         transformer-less; legacy installations use LF transformer types.
    asset.v1.ListAssetsRequest:
      type: object
      properties:
        categoryFilter:
          title: category_filter
          $ref: '#/components/schemas/asset.v1.AssetCategory'
        manufacturerFilter:
          type: string
          title: manufacturer_filter
        pagination:
          title: pagination
          $ref: '#/components/schemas/packages.api.v1.pagination.PaginationRequest'
      title: ListAssetsRequest
      additionalProperties: false
    asset.v1.ListAssetsResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/asset.v1.Asset'
          title: assets
        pagination:
          title: pagination
          $ref: '#/components/schemas/packages.api.v1.pagination.PaginationResponse'
      title: ListAssetsResponse
      additionalProperties: false
    asset.v1.UpdateAssetRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        manufacturer:
          type: string
          title: manufacturer
        model:
          type: string
          title: model
        dimensions:
          title: dimensions
          $ref: '#/components/schemas/asset.v1.Dimensions'
        electrical:
          title: electrical
          $ref: '#/components/schemas/asset.v1.ElectricalParameters'
        model3dPath:
          type: string
          title: model_3d_path
        metadataJson:
          type: string
          title: metadata_json
      title: UpdateAssetRequest
      additionalProperties: false
    asset.v1.UpdateAssetResponse:
      type: object
      properties:
        asset:
          title: asset
          $ref: '#/components/schemas/asset.v1.Asset'
      title: UpdateAssetResponse
      additionalProperties: false
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.FieldMask:
      type: string
      description: |-
        `FieldMask` represents a set of symbolic field paths, for example:

             paths: "f.a"
             paths: "f.b.d"

         Here `f` represents a field in some root message, `a` and `b`
         fields in the message found in `f`, and `d` a field found in the
         message in `f.b`.

         Field masks are used to specify a subset of fields that should be
         returned by a get operation or modified by an update operation.
         Field masks also have a custom JSON encoding (see below).

         # Field Masks in Projections

         When used in the context of a projection, a response message or
         sub-message is filtered by the API to only contain those fields as
         specified in the mask. For example, if the mask in the previous
         example is applied to a response message as follows:

             f {
               a : 22
               b {
                 d : 1
                 x : 2
               }
               y : 13
             }
             z: 8

         The result will not contain specific values for fields x,y and z
         (their value will be set to the default, and omitted in proto text
         output):


             f {
               a : 22
               b {
                 d : 1
               }
             }

         A repeated field is not allowed except at the last position of a
         paths string.

         If a FieldMask object is not present in a get operation, the
         operation applies to all fields (as if a FieldMask of all fields
         had been specified).

         Note that a field mask does not necessarily apply to the
         top-level response message. In case of a REST get operation, the
         field mask applies directly to the response, but in case of a REST
         list operation, the mask instead applies to each individual message
         in the returned resource list. In case of a REST custom method,
         other definitions may be used. Where the mask applies will be
         clearly documented together with its declaration in the API.  In
         any case, the effect on the returned resource/resources is required
         behavior for APIs.

         # Field Masks in Update Operations

         A field mask in update operations specifies which fields of the
         targeted resource are going to be updated. The API is required
         to only change the values of the fields as specified in the mask
         and leave the others untouched. If a resource is passed in to
         describe the updated values, the API ignores the values of all
         fields not covered by the mask.

         If a repeated field is specified for an update operation, new values will
         be appended to the existing repeated field in the target resource. Note that
         a repeated field is only allowed in the last position of a `paths` string.

         If a sub-message is specified in the last position of the field mask for an
         update operation, then new value will be merged into the existing sub-message
         in the target resource.

         For example, given the target message:

             f {
               b {
                 d: 1
                 x: 2
               }
               c: [1]
             }

         And an update message:

             f {
               b {
                 d: 10
               }
               c: [2]
             }

         then if the field mask is:

          paths: ["f.b", "f.c"]

         then the result will be:

             f {
               b {
                 d: 10
                 x: 2
               }
               c: [1, 2]
             }

         An implementation may provide options to override this default behavior for
         repeated and message fields.

         In order to reset a field's value to the default, the field must
         be in the mask and set to the default value in the provided resource.
         Hence, in order to reset all fields of a resource, provide a default
         instance of the resource and set all fields in the mask, or do
         not provide a mask as described below.

         If a field mask is not present on update, the operation applies to
         all fields (as if a field mask of all fields has been specified).
         Note that in the presence of schema evolution, this may mean that
         fields the client does not know and has therefore not filled into
         the request will be reset to their default. If this is unwanted
         behavior, a specific service may require a client to always specify
         a field mask, producing an error if not.

         As with get operations, the location of the resource which
         describes the updated values in the request message depends on the
         operation kind. In any case, the effect of the field mask is
         required to be honored by the API.

         ## Considerations for HTTP REST

         The HTTP kind of an update operation which uses a field mask must
         be set to PATCH instead of PUT in order to satisfy HTTP semantics
         (PUT must only be used for full updates).

         # JSON Encoding of Field Masks

         In JSON, a field mask is encoded as a single string where paths are
         separated by a comma. Fields name in each path are converted
         to/from lower-camel naming conventions.

         As an example, consider the following message declarations:

             message Profile {
               User user = 1;
               Photo photo = 2;
             }
             message User {
               string display_name = 1;
               string address = 2;
             }

         In proto a field mask for `Profile` may look as such:

             mask {
               paths: "user.display_name"
               paths: "photo"
             }

         In JSON, the same mask is represented as below:

             {
               mask: "user.displayName,photo"
             }

         # Field Masks and Oneof Fields

         Field masks treat fields in oneofs just as regular fields. Consider the
         following message:

             message SampleMessage {
               oneof test_oneof {
                 string name = 4;
                 SubMessage sub_message = 9;
               }
             }

         The field mask can be:

             mask {
               paths: "name"
             }

         Or:

             mask {
               paths: "sub_message"
             }

         Note that oneof type names ("test_oneof" in this case) cannot be used in
         paths.

         ## Field Mask Verification

         The implementation of any API method which has a FieldMask type field in the
         request should verify the included field paths, and return an
         `INVALID_ARGUMENT` error if any path is unmappable.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
