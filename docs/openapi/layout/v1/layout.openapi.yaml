          title: submitted_by_actor_id
      title: SubmitLayoutForReviewRequest
      additionalProperties: false
      description: ========== Acceptance Request/Response Messages ==========
    layout.v1.SubmitLayoutForReviewResponse:
      type: object
      properties:
        layout:
          title: layout
          $ref: '#/components/schemas/layout.v1.Layout'
        reviewMetadata:
          title: review_metadata
          $ref: '#/components/schemas/layout.v1.ReviewMetadata'
      title: SubmitLayoutForReviewResponse
      additionalProperties: false
