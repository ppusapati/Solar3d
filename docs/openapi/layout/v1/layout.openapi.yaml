info:
  title: layout.v1
paths:
  /layout.v1.LayoutService/ApproveLayout:
    post:
      tags:
        - layout.v1.LayoutService
      summary: ApproveLayout
      description: ApproveLayout sets review_metadata.status to APPROVED, enabling ElectricalReady transition.
      operationId: layout.v1.LayoutService.ApproveLayout
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/layout.v1.ApproveLayoutRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/layout.v1.ApproveLayoutResponse'
