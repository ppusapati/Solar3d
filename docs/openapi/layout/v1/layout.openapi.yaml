          $ref: '#/components/schemas/layout.v1.AcceptanceStatus'
        reviewedByActorId:
          type: string
          title: reviewed_by_actor_id
          description: reviewed_by_actor_id is the user or system actor that performed the review action.
        reviewedAt:
          title: reviewed_at
          description: reviewed_at is the timestamp of the most recent review action.
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        qualityScore:
          type: number
          title: quality_score
          format: double
          description: quality_score is a reviewer-assigned [0, 1] quality rating.
        reviewComments:
          type: array
          items:
            type: string
          title: review_comments
          description: review_comments are free-text annotations from the reviewer.
        blockers:
          type: array
          items:
            type: string
          title: blockers
          description: blockers are unresolved reasons preventing approval. Empty when approved.
        approvalTimestampUnixSecs:
          type: string
          title: approval_timestamp_unix_secs
          description: approval_timestamp_unix_secs records the ISO-8601 approval time for the audit trail.
      title: ReviewMetadata
      additionalProperties: false
      description: |-
        ========== Review Metadata ==========
         ReviewMetadata captures the acceptance workflow state attached to a layout.
         Populated by the SubmitLayoutForReview / ApproveLayout / RejectLayout RPCs.
         Consumed by PlanningWorkflow gate enforcement for the LayoutReady -> ElectricalReady transition.
    layout.v1.SubmitLayoutForReviewRequest:
      type: object
      properties:
        layoutId:
          type: string
          title: layout_id
        submissionReason:
          type: string
          title: submission_reason
