    transmission.v1.AcceptanceStatus:
      type: string
      title: AcceptanceStatus
      enum:
        - ACCEPTANCE_STATUS_UNSPECIFIED
        - ACCEPTANCE_STATUS_DRAFT
        - ACCEPTANCE_STATUS_REVIEW_PENDING
        - ACCEPTANCE_STATUS_APPROVED
        - ACCEPTANCE_STATUS_REJECTED
      description: |-
        ========== Acceptance Status Enum ==========
         AcceptanceStatus is the workflow gate acceptance state — distinct from ApprovalStatus
         (which tracks the governance review stage). AcceptanceStatus determines whether this
         artefact satisfies its predecessor gate for phase progression.
    transmission.v1.ApprovalStatus:
      type: string
      title: ApprovalStatus
      enum:
        - APPROVAL_STATUS_UNSPECIFIED
        - APPROVAL_STATUS_DRAFT
        - APPROVAL_STATUS_ENGINEERING_REVIEW
        - APPROVAL_STATUS_APPROVED
        - APPROVAL_STATUS_REJECTED
    transmission.v1.ApproveTransmissionRouteRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        actor:
          type: string
          title: actor
        note:
          type: string
          title: note
        qualityScore:
          type: number
          title: quality_score
          format: double
          description: quality_score is the reviewer-assigned quality rating [0, 1].
        feasibilityScore:
          type: number
          title: feasibility_score
          format: double
          description: feasibility_score is the reviewer-assigned engineering feasibility score [0, 1].
        approvalComments:
          type: array
          items:
            type: string
          title: approval_comments
          description: approval_comments are free-text comments attached to the approval.
      title: ApproveTransmissionRouteRequest
      additionalProperties: false
      description: |-
        ApproveTransmissionRouteRequest approves a route in engineering review,
         setting acceptance_status to APPROVED and recording quality/feasibility scores.
    transmission.v1.ApproveTransmissionRouteResponse:
      type: object
      properties:
        route:
          title: route
          $ref: '#/components/schemas/transmission.v1.TransmissionRoute'
      title: ApproveTransmissionRouteResponse
      additionalProperties: false
      description: ApproveTransmissionRouteResponse returns the route with APPROVED acceptance state.
    transmission.v1.CalculateTransmissionRouteRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
        voltageClass:
          title: voltage_class
          $ref: '#/components/schemas/transmission.v1.VoltageClass'
        farmOutputPoint:
          title: farm_output_point
          $ref: '#/components/schemas/transmission.v1.Waypoint'
        gridInjectionPoint:
          title: grid_injection_point
          $ref: '#/components/schemas/transmission.v1.Waypoint'
        constraints:
          title: constraints
          $ref: '#/components/schemas/transmission.v1.TransmissionConstraints'
        elevationRaster:
          title: elevation_raster
          $ref: '#/components/schemas/transmission.v1.ElevationRasterInput'
        obstacleRaster:
          title: obstacle_raster
          $ref: '#/components/schemas/transmission.v1.ObstacleRasterInput'
        vectorFeatures:
          type: array
          items:
            $ref: '#/components/schemas/transmission.v1.VectorFeatureInput'
          title: vector_features
      title: CalculateTransmissionRouteRequest
      additionalProperties: false
    transmission.v1.CalculateTransmissionRouteResponse:
      type: object
      properties:
        route:
          title: route
          $ref: '#/components/schemas/transmission.v1.TransmissionRoute'
      title: CalculateTransmissionRouteResponse
      additionalProperties: false
    transmission.v1.CostBookEntry:
      type: object
      properties:
        category:
          type: string
          title: category
        subcategory:
          type: string
          title: subcategory
        amount:
          type: number
          title: amount
          format: double
        basis:
          type: string
          title: basis
      title: CostBookEntry
      additionalProperties: false
    transmission.v1.CostBreakdown:
      type: object
      properties:
        conductorCost:
          type: number
          title: conductor_cost
          format: double
        towerCost:
          type: number
          title: tower_cost
          format: double
        rowAcquisitionCost:
          type: number
          title: row_acquisition_cost
          format: double
        crossingPremium:
          type: number
          title: crossing_premium
