components:
  schemas:
    commissioning.v1.AddChecklistItemRequest:
      type: object
      properties:
        checklistId:
          type: string
          title: checklist_id
        description:
          type: string
          title: description
        section:
          title: section
          $ref: '#/components/schemas/commissioning.v1.ChecklistSection'
        required:
          type: boolean
          title: required
        sequence:
          type: integer
          title: sequence
          format: int32
      title: AddChecklistItemRequest
      additionalProperties: false
    commissioning.v1.AddChecklistItemResponse:
      type: object
      properties:
        item:
          title: item
          $ref: '#/components/schemas/commissioning.v1.ChecklistItem'
      title: AddChecklistItemResponse
      additionalProperties: false
    commissioning.v1.AsBuiltArtifact:
      type: object
      properties:
        id:
          type: string
          title: id
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
        artifactType:
          title: artifact_type
          $ref: '#/components/schemas/commissioning.v1.AsBuiltArtifactType'
        storageUrl:
          type: string
          title: storage_url
        uploadedBy:
          type: string
          title: uploaded_by
        uploadedAt:
          title: uploaded_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        description:
          type: string
          title: description
        fileSizeBytes:
          type:
            - integer
            - string
          title: file_size_bytes
          format: int64
        revision:
          type: string
          title: revision
      title: AsBuiltArtifact
      additionalProperties: false
    commissioning.v1.AsBuiltArtifactType:
      type: string
      title: AsBuiltArtifactType
      enum:
        - AS_BUILT_ARTIFACT_TYPE_UNSPECIFIED
        - AS_BUILT_ARTIFACT_TYPE_DRAWING
        - AS_BUILT_ARTIFACT_TYPE_REPORT
        - AS_BUILT_ARTIFACT_TYPE_SPECIFICATION
        - AS_BUILT_ARTIFACT_TYPE_PHOTO
        - AS_BUILT_ARTIFACT_TYPE_TEST_RECORD
        - AS_BUILT_ARTIFACT_TYPE_CERTIFICATE
    commissioning.v1.ChecklistItem:
      type: object
      properties:
        id:
          type: string
          title: id
        checklistId:
          type: string
          title: checklist_id
        description:
          type: string
          title: description
        section:
          title: section
          $ref: '#/components/schemas/commissioning.v1.ChecklistSection'
        status:
          title: status
          $ref: '#/components/schemas/commissioning.v1.ChecklistItemStatus'
        required:
          type: boolean
          title: required
        completedBy:
          type: string
          title: completed_by
        completedAt:
          title: completed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        notes:
          type: string
          title: notes
        sequence:
          type: integer
          title: sequence
          format: int32
          description: display sort order
      title: ChecklistItem
      additionalProperties: false
    commissioning.v1.ChecklistItemStatus:
      type: string
      title: ChecklistItemStatus
      enum:
        - CHECKLIST_ITEM_STATUS_UNSPECIFIED
        - CHECKLIST_ITEM_STATUS_PENDING
        - CHECKLIST_ITEM_STATUS_PASS
        - CHECKLIST_ITEM_STATUS_FAIL
        - CHECKLIST_ITEM_STATUS_NOT_APPLICABLE
    commissioning.v1.ChecklistSection:
      type: string
      title: ChecklistSection
      enum:
        - CHECKLIST_SECTION_UNSPECIFIED
        - CHECKLIST_SECTION_CIVIL
        - CHECKLIST_SECTION_MECHANICAL
        - CHECKLIST_SECTION_ELECTRICAL
        - CHECKLIST_SECTION_PROTECTION
        - CHECKLIST_SECTION_SCADA
        - CHECKLIST_SECTION_SAFETY
        - CHECKLIST_SECTION_DOCUMENTATION
    commissioning.v1.CommissioningChecklist:
      type: object
      properties:
        id:
          type: string
          title: id
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
        status:
          title: status
          $ref: '#/components/schemas/commissioning.v1.CommissioningStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/commissioning.v1.ChecklistItem'
          title: items
        signoffs:
          type: array
          items:
            $ref: '#/components/schemas/commissioning.v1.CommissioningSignoff'
          title: signoffs
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        createdBy:
          type: string
          title: created_by
        totalItems:
          type: integer
          title: total_items
          format: int32
          description: Derived counts (read-only)
        completedItems:
          type: integer
          title: completed_items
          format: int32
        failedItems:
          type: integer
          title: failed_items
          format: int32
      title: CommissioningChecklist
      additionalProperties: false
    commissioning.v1.CommissioningSignoff:
      type: object
      properties:
        id:
          type: string
          title: id
        checklistId:
          type: string
          title: checklist_id
        signedBy:
          type: string
          title: signed_by
        role:
          type: string
          title: role
          description: e.g. "EPC_ENGINEER", "CLIENT_REPRESENTATIVE", "ELECTRICAL_INSPECTOR"
        comments:
          type: string
          title: comments
        signedAt:
          title: signed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: CommissioningSignoff
      additionalProperties: false
    commissioning.v1.CommissioningStatus:
      type: string
      title: CommissioningStatus
      enum:
        - COMMISSIONING_STATUS_UNSPECIFIED
        - COMMISSIONING_STATUS_PENDING
        - COMMISSIONING_STATUS_IN_PROGRESS
        - COMMISSIONING_STATUS_COMPLETED
        - COMMISSIONING_STATUS_SIGNED_OFF
        - COMMISSIONING_STATUS_HANDED_OVER
    commissioning.v1.CreateChecklistRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
        createdBy:
