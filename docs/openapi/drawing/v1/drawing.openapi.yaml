components:
  schemas:
    common.v1.ApiVersion:
      type: object
      properties:
        major:
          type: integer
          title: major
        minor:
          type: integer
          title: minor
        patch:
          type: integer
          title: patch
      title: ApiVersion
      additionalProperties: false
      description: Semantic version carried in API payloads for compatibility checks.
    common.v1.ContractMetadata:
      type: object
      properties:
        schemaVersion:
          title: schema_version
          $ref: '#/components/schemas/common.v1.ApiVersion'
        schemaId:
          type: string
          title: schema_id
        schemaHash:
          type: string
          title: schema_hash
        producer:
          type: string
          title: producer
        correlationId:
          type: string
          title: correlation_id
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ContractMetadata
      additionalProperties: false
      description: Metadata shared across contracts to support tracing and lineage.
    common.v1.LineString2D:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/common.v1.Point2D'
          title: points
      title: LineString2D
      additionalProperties: false
    common.v1.Point2D:
      type: object
      properties:
        x:
          type: number
          title: x
          format: double
        y:
          type: number
          title: y
          format: double
      title: Point2D
      additionalProperties: false
    common.v1.Polygon2D:
      type: object
      properties:
        rings:
          type: array
          items:
            $ref: '#/components/schemas/common.v1.LineString2D'
          title: rings
          description: First ring is outer shell, remaining rings are holes.
      title: Polygon2D
      additionalProperties: false
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
