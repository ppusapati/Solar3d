tags:
  - name: drawing.v1.DrawingRevisionService
    description: DrawingRevisionService manages drawing metadata and immutable revision snapshots.
  - name: drawing.v1.CadCoreService
    description: CadCoreService validates and applies drawing commands on top of revision storage.
  - name: drawing.v1.CadAnnotationService
    description: CadAnnotationService manages associative drafting annotations layered on CadCoreService.
  - name: drawing.v1.CadLayerBlockService
    description: CadLayerBlockService manages layer standards, block definitions, and block inserts.
  - name: drawing.v1.InteropService
    description: InteropService imports, exports, and validates round-trips for supported CAD exchange formats.
  - name: drawing.v1.PlotSheetService
    description: PlotSheetService manages sheet definitions and publish artifacts.
