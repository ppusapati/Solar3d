global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    system: 'solar3d-ml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Compute Service
  - job_name: 'compute-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['compute-service:8081']
        labels:
          service: 'compute-service'
          component: 'ml-training'
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Orchestration Service
  - job_name: 'compute-orchestration-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['compute-orchestration-service:8082']
        labels:
          service: 'compute-orchestration-service'
          component: 'orchestration'
    scrape_interval: 10s
    scrape_timeout: 5s

  # ML Inference Bridge
  - job_name: 'ml-inference-bridge'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-inference-bridge:3030']
        labels:
          service: 'ml-inference-bridge'
          component: 'inference'
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          database: 'solar3d'
    scrape_interval: 30s

  # MinIO
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'
          component: 'storage'
    scrape_interval: 30s
