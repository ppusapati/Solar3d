version: '3.9'

services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: docker.io/postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solar3d}
      POSTGRES_USER: ${POSTGRES_USER:-solar3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
      - ./migrations/004_ml_learning_system.sql:/docker-entrypoint-initdb.d/004_ml_learning_system.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solar3d}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-solar3d}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  # ============================================================
  # ML Services
  # ============================================================

  compute-service:
    build:
      context: .
      dockerfile: services/compute-service/Dockerfile
    environment:
      PORT: "50051"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-solar3d}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?err}"
    ports:
      - "8081:50051"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  compute-orchestration-service:
    build:
      context: .
      dockerfile: services/compute-orchestration-service/Dockerfile
    environment:
      PORT: ":8082"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      COMPUTE_SERVICE_URL: "http://compute-service:50051"
      GEO_SERVICE_URL: "http://compute-service:50051"
      GRAPH_SERVICE_URL: "http://compute-service:50051"
      OPTIMIZATION_SERVICE_URL: "http://compute-service:50051"
      SIMULATION_SERVICE_URL: "http://compute-service:50051"
      ML_INFERENCE_SERVICE_URL: "http://compute-service:50051"
      PLOT_SHEET_SERVICE_URL: "http://plot-sheet-service:8080"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-solar3d}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?err}"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      compute-service:
        condition: service_healthy
      plot-sheet-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8082/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  # ============================================================
  # ML Inference Bridge (Rust)
  # ============================================================

  ml-inference-bridge:
    build:
      context: .
      dockerfile: compute/ml-inference/Dockerfile
    environment:
      RUST_LOG: "info"
      RUST_ML_BRIDGE_ADDR: "0.0.0.0:3030"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-solar3d}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?err}"
    ports:
      - "3030:3030"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3030/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  # ============================================================
  # Backend Services
  # ============================================================

  project-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: project-service
    environment:
      PORT: "8001"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      CORS_ALLOWED_ORIGIN: "${CORS_ALLOWED_ORIGIN:-*}"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8001/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  terrain-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: terrain-service
    environment:
      PORT: "8002"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "terrain"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8002/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  layout-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: layout-service
    environment:
      PORT: "8003"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      TILE_SIZE: "100.0"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8003/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  simulation-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: simulation-service
    environment:
      PORT: "8004"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8004/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  electrical-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: electrical-service
    environment:
      PORT: "8005"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8005/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  routing-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: routing-service
    environment:
      PORT: "8006"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8006/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  transmission-routing-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: transmission-routing-service
    environment:
      PORT: "8009"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      TERRAIN_BRIDGE_URL: "http://host.containers.internal:8084"
      PROJECT_SERVICE_URL: "http://project-service:8001"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8009:8009"
    depends_on:
      postgres:
        condition: service_healthy
      project-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8009/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  report-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: report-service
    environment:
      PORT: "8007"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "reports"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8007/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  asset-service:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE_NAME: asset-service
    environment:
      PORT: "8008"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=${DB_SSLMODE:-disable}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PROJECT_SERVICE_URL: "http://project-service:8001"
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
      project-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8008/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  # ============================================================
  # CAD Platform Services (Drawing, Revision, Core)
  # ============================================================

  drawing-revision-service:
    build:
      context: .
      dockerfile: services/drawing-revision-service/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-solar3d}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-solar3d}?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8091:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  cad-core-service:
    build:
      context: .
      dockerfile: services/cad-core-service/Dockerfile
    environment:
      PORT: "8080"
      DRAWING_REVISION_URL: "http://drawing-revision-service:8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8092:8080"
    depends_on:
      drawing-revision-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  cad-annotation-service:
    build:
      context: .
      dockerfile: services/cad-annotation-service/Dockerfile
    environment:
      PORT: "8080"
      DRAWING_REVISION_URL: "http://drawing-revision-service:8080"
      CAD_CORE_URL: "http://cad-core-service:8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8093:8080"
    depends_on:
      drawing-revision-service:
        condition: service_healthy
      cad-core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  cad-layer-block-service:
    build:
      context: .
      dockerfile: services/cad-layer-block-service/Dockerfile
    environment:
      PORT: "8080"
      DRAWING_REVISION_URL: "http://drawing-revision-service:8080"
      CAD_CORE_URL: "http://cad-core-service:8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8094:8080"
    depends_on:
      drawing-revision-service:
        condition: service_healthy
      cad-core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  interop-service:
    build:
      context: .
      dockerfile: services/interop-service/Dockerfile
    environment:
      PORT: "8080"
      DRAWING_REVISION_URL: "http://drawing-revision-service:8080"
      CAD_CORE_URL: "http://cad-core-service:8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8095:8080"
    depends_on:
      drawing-revision-service:
        condition: service_healthy
      cad-core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  plot-sheet-service:
    build:
      context: .
      dockerfile: services/plot-sheet-service/Dockerfile
    environment:
      PORT: "8080"
      DRAWING_REVISION_URL: "http://drawing-revision-service:8080"
      CAD_CORE_URL: "http://cad-core-service:8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8096:8080"
    depends_on:
      drawing-revision-service:
        condition: service_healthy
      cad-core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  # ============================================================
  # Advanced Analytics Services
  # ============================================================

  geo-analytics-service:
    build:
      context: .
      dockerfile: services/geo-analytics-service/Dockerfile
    environment:
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8016:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  graph-service:
    build:
      context: .
      dockerfile: services/graph-service/Dockerfile
    environment:
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8017:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  optimization-service:
    build:
      context: .
      dockerfile: services/optimization-service/Dockerfile
    environment:
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8018:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  ml-service:
    build:
      context: .
      dockerfile: services/ml-service/Dockerfile
    environment:
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8019:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  api-gateway-service:
    build:
      context: .
      dockerfile: services/api-gateway-service/Dockerfile
    environment:
      PORT: "8080"
      PROJECT_SERVICE_URL: "http://project-service:8001"
      DRAWING_REVISION_URL: "http://drawing-revision-service:8080"
      CAD_CORE_URL: "http://cad-core-service:8080"
      CAD_ANNOTATION_URL: "http://cad-annotation-service:8080"
      CAD_LAYER_BLOCK_URL: "http://cad-layer-block-service:8080"
      INTEROP_URL: "http://interop-service:8080"
      PLOT_SHEET_URL: "http://plot-sheet-service:8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "8090:8080"
    depends_on:
      project-service:
        condition: service_healthy
      drawing-revision-service:
        condition: service_healthy
      cad-core-service:
        condition: service_healthy
      cad-annotation-service:
        condition: service_healthy
      cad-layer-block-service:
        condition: service_healthy
      interop-service:
        condition: service_healthy
      plot-sheet-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  # ============================================================
  # Monitoring & Observability
  # ============================================================

  prometheus:
    image: docker.io/prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - solar3d

  grafana:
    image: docker.io/grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    depends_on:
      - prometheus
    networks:
      - solar3d

  # ============================================================
  # Frontend & Reverse Proxy
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

  nginx:
    image: docker.io/nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      project-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - solar3d

# ============================================================
# Volumes
# ============================================================

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

# ============================================================
# Networks
# ============================================================

networks:
  solar3d:
    driver: bridge
