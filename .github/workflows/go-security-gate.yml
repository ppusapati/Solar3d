name: Go Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  govulncheck:
    name: Govulncheck (all Go modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck across repo modules
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t modules < <(find . -name go.mod \
            -not -path './frontend/*' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            | sed 's|/go.mod$||' \
            | sort)

          if [[ ${#modules[@]} -eq 0 ]]; then
            echo "No Go modules found."
            exit 0
          fi

          echo "Found ${#modules[@]} Go modules"
          for mod in "${modules[@]}"; do
            echo "::group::govulncheck ${mod}"
            (
              cd "${mod}"
              govulncheck ./...
            )
            echo "::endgroup::"
          done
